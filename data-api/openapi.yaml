        type:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 64
          description: "The event type the test event carries."
          examples:
            - "earnings.created"
        livemode:
          type: "boolean"
          enum:

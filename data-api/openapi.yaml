openapi: "3.1.1"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: "Darvas Data API"
  version: "0.9.0"
  summary: "Company, filing, insider, institutional, market and macro data for every SEC filer, US stocks, UK and French companies and crypto markets."
  description: "Every value names its source. Field names follow financialdatasets.ai, so a client written for it reads these answers unchanged; fields it does not have come after its own. Send the API key in the X-API-KEY header or as a Bearer token. Dates are ISO 8601 and times are RFC 3339 in UTC."
  termsOfService: "https://darvas.app/terms"
  contact:
    name: "Darvas data"
    url: "https://darvas.app"
    email: "support@darvas.app"
  license:
    name: "Proprietary"
    identifier: "LicenseRef-Darvas-Proprietary"
externalDocs:
  description: "Market coverage"
  url: "https://docs.darvas.app/data-api/coverage"
servers:
  - url: "https://darvas.app/api/data/v1"
    description: "Production."
security:
  - apiKey: []
  - bearerKey: []
tags:
  - name: "company"
    description: "Company profiles from SEC submissions."
  - name: "crypto"
    description: "Candles of OKX and Hyperliquid instruments from Darvas's own market data."
  - name: "defi"
    description: "Multi-chain DeFi protocol TVL, stablecoin supply, yield pools, and on-chain DEX liquidity."
  - name: "earnings"
    description: "Each filing that reports a period, the 8-K earnings release, then the 10-Q or 10-K, and the KPIs, guidance and non-GAAP metrics of the releases."
  - name: "filings"
    description: "SEC filing lists, the items of 10-K, 10-Q and 8-K filings, and search over them."
  - name: "financials"
    description: "Standardized income statements, balance sheets and cash flow statements from XBRL filings."
  - name: "funds"
    description: "Holdings of registered funds and ETFs from Form N-PORT."
  - name: "insiders"
    description: "Insider trades and holdings from Forms 3, 4 and 5, and sale notices from Form 144."
  - name: "institutions"
    description: "Positions of investment managers from Form 13F reports."
  - name: "ipos"
    description: "Registration statements and prospectuses of companies going public."
  - name: "macro"
    description: "Policy rates, the Treasury yield curve, inflation, jobs and GDP from their publishers."
  - name: "markets"
    description: "Market structure data: the shares that failed to settle each day, from SEC, and futures positions by trader group, from the CFTC."
  - name: "news"
    description: "Company 8-K filings and the press releases of the Federal Reserve, the SEC, the BEA and the BLS."
  - name: "ownership"
    description: "Owners of more than 5% from Schedules 13D and 13G."
  - name: "prediction-markets"
    description: "Binary event contract odds across Polymarket and Kalshi plus cross-venue arbitrage spreads."
  - name: "tokenized-stocks"
    description: "Coinbase stock tokens on Base, priced by their USDC pools."
  - name: "webhooks"
    description: "Destinations that receive a signed event when new filings, statements, insider forms or macro releases arrive."
paths:
  "/company/facts":
    get:
      operationId: "getCompanyFacts"
      tags:
        - "company"
      summary: "Read a company profile"
      description: "The current SEC profile of a company, found by ticker or CIK, with every ticker it has been listed under."
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - $ref: "#/components/parameters/Cik"
      responses:
        "200":
          description: "Read a company profile: one page."
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CompanyFactsResponse"
              example:
                company_facts:
                  ticker: "AAPL"
                  name: "Apple Inc."
                  cik: "0000320193"
                  industry: "Electronic Computers"
                  sector: "Technology"
                  exchange: "Nasdaq"
                  is_active: true
                  location: "CUPERTINO, CA"
                  sec_filings_url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000320193"
                  sic_code: "3571"
                  sic_industry: "Electronic Computers"
                  sic_sector: "Manufacturing"
                  entity_type: "operating"
                  category: "Large accelerated filer"
                  fiscal_year_end: "0925"
                  state_of_incorporation: "CA"
                  ein: "942404110"
                  lei: null
                  website_url: null
                  investor_website_url: null
                  phone: "(408) 996-1010"
                  addresses:
                    business:
                      city: "CUPERTINO"
                      stateOrCountry: "CA"
                  former_names:
                    - name: "APPLE COMPUTER INC"
                      from: "1994-01-26T00:00:00.000Z"
                      to: "2007-01-04T00:00:00.000Z"
                  tickers:
                    - ticker: "AAPL"
                      exchange: "Nasdaq"
                      first_seen: "2026-11-25"
                      last_seen: "2026-11-25"
                  profile_updated_at: "2026-11-25 10:40:00.000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/filings":
    get:
      operationId: "listFilings"
      tags:
        - "filings"
      summary: "List a company's filings"
      description: "SEC filings of one company, newest first. limit counts across pages; each page holds at most 100 filings and links the next one in next_page_url."
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - $ref: "#/components/parameters/Cik"
        - $ref: "#/components/parameters/FilingType"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "List a company's filings: one page."
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/FilingsResponse"
              example:
                filings:
                  - cik: 320193
                    accession_number: "0000320193-26-000105"
                    filing_type: "10-K"
                    report_date: "2026-09-26"
                    filing_date: "2026-10-31"
                    ticker: "AAPL"
                    url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000105/aapl-20260926.htm"
                    accepted_at: "2026-10-31T06:01:05Z"
                    act: "34"
                    file_number: "001-36743"
                    film_number: "261234567"
                    items: []
                    size_bytes: 9876543
                    is_xbrl: true
                    is_inline_xbrl: true
                    primary_document: "aapl-20260926.htm"
                    primary_document_description: "10-K"
                    index_url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000105/0000320193-26-000105-index.htm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/filings/items":
    get:
      operationId: "getFilingItems"
      tags:
        - "filings"
      summary: "Read a filing's items"
      description: "The text of each item of one 10-K, 10-Q or 8-K, such as Item 1A Risk Factors or Item 2.02 Results of Operations. A 10-K and a 10-Q are found by fiscal year and quarter, an 8-K by its accession number. Darvas reads every new filing as EDGAR lists it; an older one is read when a request asks for it, and the request waits up to 8 seconds before answering 202 with a result_url to poll."
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - $ref: "#/components/parameters/Cik"
        - $ref: "#/components/parameters/ItemsFilingType"
        - $ref: "#/components/parameters/ItemsYear"
        - $ref: "#/components/parameters/ItemsQuarter"
        - $ref: "#/components/parameters/Item"
        - $ref: "#/components/parameters/ItemsAccessionNumber"
        - $ref: "#/components/parameters/IncludeExhibits"
      responses:
        "200":
          description: "The filing's items."
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/FilingItemsResponse"
              example:
                resource: "filing-items"
                ticker: "AAPL"
                cik: 320193
                filing_type: "8-K"
                accession_number: "0000320193-26-000024"
                year: 2026
                quarter: null
                filing_date: "2026-10-30"
                report_period: "2026-10-30"
                filing_url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/0000320193-26-000024-index.htm"
                items:
                  - number: "Item-2.02"
                    name: "Results of Operations and Financial Condition"
                    text: "On October 30, 2026, Apple Inc. issued a press release regarding its financial results."
                    exhibits:
                      - number: "99.1"
                        description: "EX-99.1"
                        url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/a8-kex991q4202609262026.htm"
                        text: "Apple reports fourth quarter results"
        "202":
          description: "Darvas is still reading the filing."
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            Location:
              description: "The result_url of the answer."
              schema:
                type: "string"
                format: "uri"
                maxLength: 200
              example: "https://darvas.app/api/data/v1/filings/items/requests/6f1c3a52-7d5e-4a2b-9c1d-2e3f4a5b6c7d"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/FilingItemsAccepted"
              example:
                status: "processing"
                request_id: "6f1c3a52-7d5e-4a2b-9c1d-2e3f4a5b6c7d"
                accession_number: "0000320193-26-000024"
                estimated_ready_at: "2026-11-25T18:30:45.000Z"
                result_url: "https://darvas.app/api/data/v1/filings/items/requests/6f1c3a52-7d5e-4a2b-9c1d-2e3f4a5b6c7d"
                message: "Darvas is reading this filing from SEC EDGAR. Poll result_url after Retry-After seconds, or send this request again."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/filings/items/requests/{request_id}":
    get:
      operationId: "getFilingItemsRequest"
      tags:
        - "filings"
      summary: "Read a filing items request"
      description: "The result of a /filings/items request that answered 202: processing while Darvas reads the filing, the items once it has, or failed when SEC EDGAR did not serve it. A failed request is tried again by sending the first request again."
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: "The request's status, or the filing's items."
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            "application/json":
              schema:
                description: "Processing, the items, or failed."
                oneOf:
                  - $ref: "#/components/schemas/FilingItemsRequestProcessing"
                  - $ref: "#/components/schemas/FilingItemsResponse"
                  - $ref: "#/components/schemas/FilingItemsRequestFailed"
              example:
                status: "processing"
                request_id: "6f1c3a52-7d5e-4a2b-9c1d-2e3f4a5b6c7d"
                accession_number: "0000320193-26-000024"
                estimated_ready_at: "2026-11-25T18:30:45.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/filings/items/types":
    get:
      operationId: "listFilingItemTypes"
      tags:
        - "filings"
      summary: "List filing item types"
      description: "The items each form can have, with their titles. A 10-K item names its number, a 10-Q item its part too, an 8-K item its number with two decimals."
      parameters:
        - $ref: "#/components/parameters/ItemTypesFilingType"
      responses:
        "200":
          description: "Each form's items."
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/FilingItemTypesResponse"
              example:
                "10-K":
                  - name: "Item-1A"
                    title: "Risk Factors"
                    description: "The material risks to the company and its securities."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/earnings":
    get:
      operationId: "listEarnings"
      tags:
        - "earnings"
      summary: "List earnings"
      description: "With a ticker or cik, each filing that reports one of the company's newest periods: the 8-K earnings release first, then the 10-Q or 10-K, sorted by report period, newest first, and filing date. limit counts periods across pages; each page holds up to 10 filings. Without either, the newest earnings filings of every company, each period once with its most complete filing, newest first."
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - $ref: "#/components/parameters/Cik"
        - $ref: "#/components/parameters/EarningsLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "List earnings: one page."
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/EarningsResponse"
              example:
                earnings:
                  - ticker: "AAPL"
                    report_period: "2026-09-26"
                    fiscal_period: "2026-Q4"
                    currency: "USD"
                    source_type: "8-K"
                    filing_date: "2026-10-30"
                    filing_datetime: "2026-10-30T16:30:21-04:00"
                    filing_window: "AFTER_HOURS"
                    signals:

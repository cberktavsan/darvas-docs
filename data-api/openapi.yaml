    WebhookCreate:
      type: "object"
      description: "A destination to make."
      additionalProperties: false
      required:
        - "url"
        - "events"
      properties:
        url:
          type: "string"
          format: "uri"
          maxLength: 2000
          description: "The HTTPS URL that receives the events."
          examples:
            - "https://hooks.example.com/darvas"
        events:
          type: "array"
          description: "The event types to receive."
          items:
            type: "string"
            enum:
              - "earnings.created"
              - "income_statements.created"
              - "balance_sheets.created"
              - "cash_flow_statements.created"
              - "financial_metrics.created"
              - "income_statement_segments.created"
              - "balance_sheet_segments.created"
              - "cash_flow_statement_segments.created"
              - "operating_kpis.created"
              - "forward_guidance.created"
              - "non_gaap_metrics.created"
              - "insider_trades.created"
              - "insider_ownership.created"
              - "insider_sale_notices.created"
              - "filing_items.metadata.created"
              - "yield_curve.created"
              - "inflation.created"
              - "labor.created"
              - "gdp.created"
              - "interest_rates.created"
            description: "An event type to receive."
          minItems: 1
          maxItems: 20
          examples:
            - - "earnings.created"
              - "income_statements.created"
      examples:
        - url: "https://hooks.example.com/darvas"
          events:
            - "earnings.created"
    Webhook:
      type: "object"
      description: "A webhook destination."
      additionalProperties: false
      required:
        - "id"
        - "url"
        - "events"
        - "active"
        - "consecutive_failures"
        - "created_at"
        - "disabled_at"
      properties:
        id:
          type: "string"
          format: "uuid"
          maxLength: 36
          description: "The destination's id."
          examples:
            - "7d0b6f3e-2a41-4c8e-9b55-1f2e3d4c5b6a"
        url:
          type: "string"
          format: "uri"
          maxLength: 2000
          description: "Where the events go."
          examples:
            - "https://hooks.example.com/darvas"
        events:
          type: "array"
          description: "The event types the destination receives."
          items:
            type: "string"
            enum:
              - "earnings.created"
              - "income_statements.created"
              - "balance_sheets.created"
              - "cash_flow_statements.created"
              - "financial_metrics.created"
              - "income_statement_segments.created"
              - "balance_sheet_segments.created"
              - "cash_flow_statement_segments.created"
              - "operating_kpis.created"
              - "forward_guidance.created"
              - "non_gaap_metrics.created"
              - "insider_trades.created"
              - "insider_ownership.created"
              - "insider_sale_notices.created"
              - "filing_items.metadata.created"
              - "yield_curve.created"
              - "inflation.created"
              - "labor.created"
              - "gdp.created"
              - "interest_rates.created"
            description: "An event type it receives."
          minItems: 1
          maxItems: 20
          examples:
            - - "earnings.created"
              - "income_statements.created"
        active:
          type: "boolean"
          description: "False once 50 attempts in a row failed."
          examples:
            - true
        consecutive_failures:
          type: "integer"
          format: "int32"
          minimum: 0
          maximum: 50
          description: "Failed attempts since the last delivery that succeeded."
          examples:
            - 0
        created_at:
          type: "string"
          format: "date-time"
          description: "When the destination was made."
          examples:
            - "2026-11-26T10:00:00.000Z"
        disabled_at:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "When the destination was disabled; null while active."
          examples:
            - null
      examples:
        - id: "7d0b6f3e-2a41-4c8e-9b55-1f2e3d4c5b6a"
          url: "https://hooks.example.com/darvas"
          events:
            - "earnings.created"
            - "income_statements.created"
          active: true
          consecutive_failures: 0
          created_at: "2026-11-26T10:00:00.000Z"
          disabled_at: null
    WebhooksResponse:

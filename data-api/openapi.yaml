        concept:
          type: "string"
          pattern: "^[A-Za-z][A-Za-z0-9-]*:[A-Za-z_][A-Za-z0-9_]*$"
          description: "The XBRL concept of a level 1 line, as prefix:name."
          examples:
            - "us-gaap:CashAndCashEquivalentsAtCarryingValue"
        value:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The value of a level 1 line for the period; null for a section header."
          examples:

components:
  securitySchemes:
    apiKey:
      type: "apiKey"
      in: "header"
      name: "X-API-KEY"
      description: "A Darvas data API key: dvk_ and 43 characters."
    bearerKey:
      type: "http"
      scheme: "bearer"
      description: "The same key as a Bearer token."
  headers:
    RateLimitLimit:
      description: "Requests per minute the key may send; on a 401 the limit a new key gets."
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 6000
      example: 60
    RetryAfter:
      description: "Seconds to wait before the next request."
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 60
      example: 1
  parameters:
    Ticker:
      name: "ticker"
      in: "query"
      required: false
      description: "The ticker, in any case. Ignored when cik is sent."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,11}$"
        maxLength: 12
      example: "AAPL"
    Cik:
      name: "cik"
      in: "query"
      required: false
      description: "The SEC Central Index Key, with or without leading zeros."
      schema:
        type: "string"
        pattern: "^[0-9]{1,10}$"
        maxLength: 10
      example: "320193"
    FilingType:
      name: "filing_type"
      in: "query"
      required: false
      style: "form"
      explode: true
      description: "Only these forms, such as 10-K or 8-K. Repeat the parameter or separate forms with commas."
      schema:
        type: "array"
        maxItems: 20
        items:
          type: "string"
          pattern: "^[A-Za-z0-9][A-Za-z0-9 /,-]{0,199}$"
          maxLength: 200
      example:
        - "10-K"
        - "8-K"
    Limit:
      name: "limit"
      in: "query"
      required: false
      description: "Rows to return across all pages."
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 10000
        default: 10
      example: 20
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      description: "The cursor from a previous next_page_url. It replaces every other parameter."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9_-]+$"
        maxLength: 4096
      example: "eyJjaWsiOjMyMDE5M30"
    Name:
      name: "name"
      in: "query"
      required: false
      description: "Only insiders whose name contains this text, in any case."
      schema:
        type: "string"

    InstitutionalHoldingPart:
      type: "object"
      description: "One information table row inside a summed position."
      additionalProperties: false
      required:
        - "row_num"
        - "other_managers"
      properties:
        row_num:
          type: "integer"
          format: "int32"
          minimum: 0
          maximum: 1000000
          description: "The row's place in the information table, from 0."
          examples:
            - 0
        shares:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Shares or principal amount on this row."
          examples:
            - 1056
        value_usd:
          type:
            - "number"
            - "null"
          format: "double"
          description: "This row's value in dollars."
          examples:
            - 13475
        shares_principal_amount_type:
          type:
            - "string"
            - "null"
          pattern: "^(SH|PRN)$"
          description: "SH for shares, PRN for principal amount."
          examples:
            - "SH"
        investment_discretion:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z]{1,10}$"
          description: "SOLE, DFND or OTR."
          examples:
            - "DFND"
        voting_authority_sole:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Shares this row's manager votes alone."
          examples:
            - 83
        voting_authority_shared:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Shares voted with others."
          examples:
            - 0
        voting_authority_none:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Shares with no voting authority."
          examples:
            - 973
        other_managers:
          type: "array"
          maxItems: 100
          description: "Sequence numbers of the other included managers on this row."
          items:
            type: "string"
            pattern: "^[0-9A-Za-z-]{1,10}$"
            maxLength: 10
          examples:
            - - "1"
      examples:
        - row_num: 0
          shares: 1056
          value_usd: 13475
          shares_principal_amount_type: "SH"
          investment_discretion: "DFND"
          voting_authority_sole: 83
          voting_authority_shared: 0
          voting_authority_none: 973
          other_managers:
            - "1"
    InstitutionalHolding:
      type: "object"
      description: "One security in one 13F report."
      additionalProperties: false
      required:
        - "name_of_issuer"
        - "report_period"
        - "filing_date"
        - "form_type"
        - "accession_number"
        - "cusip"
      properties:
        ticker:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The security's ticker, by its CUSIP; null when unknown."
          examples:
            - "ABBV"
        name_of_issuer:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "The issuer, as the report names it."
          examples:
            - "ABBVIE INC"
        report_period:
          type: "string"
          format: "date"
          description: "The quarter end the report covers."
          examples:
            - "2026-09-30"
        filing_date:
          type: "string"
          format: "date"
          description: "The day SEC received the report in force."
          examples:
            - "2026-11-16"
        form_type:
          type: "string"
          enum:
            - "13F-HR"
            - "13F-HR/A"
          description: "13F-HR, or 13F-HR/A when a restatement is in force."
          examples:
            - "13F-HR"
        accession_number:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "SEC's identifier of the report in force."
          examples:
            - "0000936936-26-000004"
        title_of_class:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 200
          description: "The class, as reported: COM, CL A, PUT."
          examples:
            - "COM"
        put_call:
          type:
            - "string"
            - "null"
          enum:
            - "Put"
            - "Call"
            - null
          description: "Put or Call for options; null for the security itself."
          examples:
            - null
        shares:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Shares or principal amount, summed over the rows."
          examples:
            - 15619
        value_usd:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Value in dollars; reports filed before 3 January 2023 were in thousands and are multiplied."
          examples:
            - 4086
        reported_price:
          type:
            - "number"
            - "null"
          format: "double"
          description: "value_usd over shares, for shares only. A price far below the market shows a filer that reported thousands."
          examples:
            - 0.2616
        filer_cik:
          type: "string"
          pattern: "^[0-9]{10}$"
          description: "Ticker searches: the filer's CIK, ten digits."
          examples:
            - "0000936936"
        filer_name:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "Ticker searches: the filer's name."
          examples:
            - "DOHENY ASSET MANAGEMENT /CA"
        subsidiaries:
          type: "array"
          maxItems: 1000
          description: "The rows summed into this position, when there are several."
          items:
            $ref: "#/components/schemas/InstitutionalHoldingPart"
        cusip:
          type: "string"
          pattern: "^[0-9A-Z]{9}$"
          description: "The security's CUSIP, as reported."
          examples:
            - "00287Y109"
        figi:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9]{12}$"
          description: "OpenFIGI's FIGI of the CUSIP, if it has one."
          examples:
            - "BBG000MDCQC2"
      examples:
        - ticker: "ABBV"
          name_of_issuer: "ABBVIE INC"
          report_period: "2026-09-30"
          filing_date: "2026-11-16"
          form_type: "13F-HR"
          accession_number: "0000936936-26-000004"
          title_of_class: "COM"
          put_call: null
          shares: 15619
          value_usd: 4086
          reported_price: 0.2616
          cusip: "00287Y109"
          figi: "BBG0025Y4RY4"

    EconomicCalendarEvent:
      type: "object"
      description: "One scheduled macroeconomic calendar release."
      additionalProperties: false
      required:
        - "id"
        - "series_key"
        - "event_name"
        - "canonical_event_name"
        - "currency"
        - "importance"
        - "release_at"
      properties:
        id:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 64
          description: "Unique release identifier."
          examples:
            - "6f1c2a9e-1b2c-4d3e-8f4a-5b6c7d8e9f01"
        series_key:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 160
          description: "Series identifier for recurring releases."
          examples:
            - "us-cpi-yoy"
        event_name:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 240
          description: "Display title of the macro release."
          examples:
            - "US CPI YoY"
        canonical_event_name:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 240
          description: "Canonical English release name."
          examples:
            - "Consumer Price Index YoY"
        currency:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 16
          description: "Three-letter currency code impacted."
          examples:
            - "USD"
        country_code:
          type:
            - "integer"
            - "null"
          format: "int32"
          minimum: 0
          maximum: 999
          description: "Numeric ISO country code when set."
          examples:
            - 840
        country_name:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 120
          description: "Country name when available."
          examples:
            - "United States"
        importance:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 16
          description: "Impact rating: low, medium, or high."
          examples:
            - "high"
        release_at:
          type: "string"
          format: "date-time"
          description: "Release timestamp in UTC."
          examples:
            - "2026-11-13T13:30:00.000Z"
        actual:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 64
          description: "Published actual value string."
          examples:
            - "2.7%"
        forecast:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 64
          description: "Consensus forecast string."
          examples:
            - "2.6%"
        previous:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 64
          description: "Prior release value string."
          examples:
            - "2.6%"
        old_previous:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 64
          description: "Unrevised prior value when revised."
          examples:
            - null
        unit:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 32
          description: "Display unit suffix."
          examples:
            - "%"
        surprise:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Actual minus consensus forecast numerically when both exist."
          examples:
            - 0.1
        surprise_pct:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Percentage surprise relative to consensus forecast."
          examples:
            - 3.8462
      examples:
        - id: "6f1c2a9e-1b2c-4d3e-8f4a-5b6c7d8e9f01"
          series_key: "us-cpi-yoy"
          event_name: "US CPI YoY"
          canonical_event_name: "Consumer Price Index YoY"
          currency: "USD"
          country_code: 840
          country_name: "United States"
          importance: "high"
          release_at: "2026-11-13T13:30:00.000Z"
          actual: "2.7%"
          forecast: "2.6%"
          previous: "2.6%"
          old_previous: null
          unit: "%"
          surprise: 0.1
          surprise_pct: 3.8462
    EconomicCalendarResponse:
      type: "object"
      description: "The answer of GET /macro/economic-calendar."
      additionalProperties: false
      required:

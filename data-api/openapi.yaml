        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/earnings/tickers":
    get:
      operationId: "listEarningsTickers"
      tags:
        - "earnings"
      summary: "List earnings tickers"
      description: "The tickers of companies with earnings filed in the last two years."
      parameters: []
      responses:
        "200":
          description: "List earnings tickers: one page."
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"

    CotSearch:
      name: "search"
      in: "query"
      required: false
      description: "Only markets whose name contains this text, in any case."
      schema:
        type: "string"
        pattern: "^[^\\x00-\\x1f]*$"
        maxLength: 100
      example: "bitcoin"
    CotReportDate:
      name: "report_date"
      in: "query"
      required: false
      description: "Only the week of this Tuesday."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2026-11-17"
    CotReportDateGte:
      name: "report_date_gte"
      in: "query"
      required: false
      description: "Only weeks on or after this day."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2026-11-17"
    CotReportDateLte:
      name: "report_date_lte"
      in: "query"
      required: false
      description: "Only weeks on or before this day."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2026-11-17"
    CotReportDateGt:
      name: "report_date_gt"
      in: "query"
      required: false
      description: "Only weeks after this day."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2026-11-17"
    CotReportDateLt:
      name: "report_date_lt"
      in: "query"
      required: false
      description: "Only weeks before this day."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2026-11-17"
    PriceTicker:
      name: "ticker"
      in: "query"
      required: true
      description: "The stock's ticker as SEC lists it, such as AAPL or BRK-B."
      schema:
        type: "string"
        pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
        maxLength: 12
      example: "AAPL"
    PriceInterval:
      name: "interval"
      in: "query"
      required: true
      description: "The length of a bar: day, week, month or year."
      schema:
        type: "string"
        enum:
          - "day"
          - "week"
          - "month"
          - "year"
      example: "day"
    PriceStartDate:
      name: "start_date"
      in: "query"
      required: false
      description: "The first day; without it, the stock's first session."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2026-01-02"
    PriceEndDate:
      name: "end_date"
      in: "query"
      required: false
      description: "The last day; without it, today."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2026-11-25"
    CalStartDate:
      name: "start_date"
      in: "query"
      required: false
      description: "Lower release date bound in YYYY-MM-DD UTC (defaults to 7 days ago)."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2026-11-01"
    CalEndDate:
      name: "end_date"
      in: "query"
      required: false
      description: "Upper release date bound in YYYY-MM-DD UTC (defaults to 14 days ahead)."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2026-12-01"
    CalCurrencies:
      name: "currencies"
      in: "query"
      required: false
      description: "Comma-separated currency codes, such as USD,EUR,GBP."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9,]{2,64}$"
        maxLength: 64
      example: "USD,EUR"
    CalImportance:
      name: "importance"
      in: "query"
      required: false
      description: "Comma-separated importance levels: low, medium, high."
      schema:
        type: "string"
        pattern: "^(low|medium|high)(,(low|medium|high)){0,2}$"
        maxLength: 32
      example: "high,medium"
    CalEventName:
      name: "event_name"
      in: "query"
      required: false
      description: "Case-insensitive event name substring filter (for example CPI or Payrolls)."
      schema:
        type: "string"
        pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
        maxLength: 120
      example: "CPI"
    CalSeriesKey:
      name: "series_key"
      in: "query"
      required: false
      description: "Exact canonical series key identifier."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9._-]{1,120}$"
        maxLength: 120
      example: "us-cpi-yoy"
    CalLimit:
      name: "limit"
      in: "query"
      required: false
      description: "Maximum releases returned per page (1 to 200; default 100)."
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 200
      example: 100
    EtfAsset:
      name: "asset"
      in: "query"
      required: false
      description: "Crypto ETF asset filter: ALL, BTC, ETH, or SOL."
      schema:
        type: "string"
        enum:
          - "ALL"
          - "BTC"
          - "ETH"
          - "SOL"
        maxLength: 8
      example: "ALL"
    EtfDays:
      name: "days"
      in: "query"
      required: false
      description: "Trailing calendar day window (1 to 365; default 30)."
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 365
      example: 30
    EtfIncludeProviders:
      name: "include_providers"
      in: "query"
      required: false
      description: "Set false to return daily asset totals only (default true)."
      schema:
        type: "string"
        enum:
          - "true"
          - "false"
        maxLength: 5
      example: "true"
    DerivTicker:
      name: "ticker"
      in: "query"
      required: false
      description: "Perpetual or spot instrument identifier such as BTC-USDT-SWAP."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,63}$"
        maxLength: 64
      example: "BTC-USDT-SWAP"
    DerivMetric:
      name: "metric"
      in: "query"
      required: false
      description: "Derivative series selector."
      schema:
        type: "string"
        enum:
          - "oi-volume"
          - "long-short"
          - "top-trader"
          - "taker-volume"
          - "funding-history"
        maxLength: 32
      example: "funding-history"
    DerivPeriod:
      name: "period"
      in: "query"
      required: false
      description: "Aggregation period."
      schema:
        type: "string"
        enum:
          - "5m"
          - "15m"
          - "30m"
          - "1H"
          - "4H"
          - "1D"
        maxLength: 8
      example: "1H"
    LookbackHours:
      name: "lookback_hours"
      in: "query"
      required: false
      description: "Hours before now to query (default 72 for derivatives, 24 for trades and liquidations)."
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 720
      example: 72
    MinNotionalUsd:
      name: "min_notional_usd"
      in: "query"
      required: false
      description: "Minimum USD notional per trade execution (default 100000)."
      schema:
        type: "number"
        format: "double"
        minimum: 0
        maximum: 1000000000
      example: 100000
    IntelLimit:
      name: "limit"
      in: "query"
      required: false
      description: "Maximum observations returned (1 to 500; default 100)."
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 500
      example: 100
    LargeTradeLimit:
      name: "limit"
      in: "query"
      required: false
      description: "Maximum large trades returned (1 to 100; default 50)."
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 100
      example: 50
    HlTicker:
      name: "ticker"
      in: "query"
      required: false
      description: "Optional Hyperliquid base ticker symbol such as BTC or ETH."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9._:/-]{1,32}$"
        maxLength: 32
      example: "BTC"
    HlSort:
      name: "sort"
      in: "query"
      required: false
      description: "Ranking metric for Hyperliquid perpetual markets."
      schema:
        type: "string"
        enum:
          - "volume_24h"
          - "open_interest"
          - "funding_rate"
          - "day_change_pct"
        maxLength: 32
      example: "volume_24h"
    IntelLimit200:
      name: "limit"
      in: "query"
      required: false
      description: "Maximum rows returned (1 to 200; default 50)."
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 200
      example: 50
    TechInterval:
      name: "interval"
      in: "query"
      required: false
      description: "Bar interval for indicator calculation: day or week (default day)."
      schema:
        type: "string"
        enum:
          - "day"
          - "week"
        maxLength: 8
      example: "day"
    PeerTickers:
      name: "tickers"
      in: "query"
      required: true
      description: "Comma-separated list of 2 to 20 US ticker symbols (for example AAPL,MSFT,GOOGL)."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9.,-]{3,200}$"
        maxLength: 200
      example: "AAPL,MSFT,GOOGL"
    OptionalTicker:
      name: "ticker"
      in: "query"
      required: false
      description: "Optional stock ticker filter (such as GME or AAPL)."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9.-]{1,12}$"
        maxLength: 12
      example: "GME"
    ShortDate:
      name: "date"
      in: "query"
      required: false
      description: "Trading session date YYYY-MM-DD (defaults to most recent FINRA trading day)."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2026-11-25"
    MinShortRatio:
      name: "min_short_ratio"
      in: "query"
      required: false
      description: "Minimum short-volume-to-total-volume ratio filter between 0 and 1."
      schema:
        type: "number"
        format: "double"
        minimum: 0
        maximum: 1
      example: 0.5
    ShortSort:
      name: "sort"
      in: "query"
      required: false
      description: "Sort order: short_volume, short_ratio, or total_volume."
      schema:
        type: "string"
        enum:
          - "short_volume"
          - "short_ratio"
          - "total_volume"
        maxLength: 20
      example: "short_volume"
    PmVenue:
      name: "venue"
      in: "query"
      required: false
      description: "Venue filter: all, polymarket, or kalshi (default all)."
      schema:
        type: "string"
        enum:
          - "all"
          - "polymarket"
          - "kalshi"
        maxLength: 16
      example: "all"
    PmQuery:
      name: "query"
      in: "query"
      required: false
      description: "Case-insensitive search keyword in market question or slug."
      schema:
        type: "string"
        pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
        maxLength: 120
      example: "Fed"
    PmCategory:
      name: "category"
      in: "query"
      required: false
      description: "Optional event category filter such as Economics, Politics, or Crypto."
      schema:
        type: "string"
        pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
        maxLength: 64
      example: "Economics"
    PmMinVolume:
      name: "min_volume"
      in: "query"
      required: false
      description: "Minimum 24-hour trading volume USD."
      schema:
        type: "number"
        format: "double"
        minimum: 0
        maximum: 10000000000
      example: 1000
    PmSort:
      name: "sort"
      in: "query"
      required: false
      description: "Sort order: volume_24h, volume_total, liquidity, or probability."
      schema:
        type: "string"
        enum:
          - "volume_24h"
          - "volume_total"
          - "liquidity"
          - "probability"
        maxLength: 20
      example: "volume_24h"
    ArbMinSimilarity:
      name: "min_similarity"
      in: "query"
      required: false
      description: "Minimum Jaccard question token similarity between 0 and 1 (default 0.5)."
      schema:
        type: "number"
        format: "double"
        minimum: 0
        maximum: 1
      example: 0.5
    ArbMinEdgePct:
      name: "min_edge_pct"
      in: "query"
      required: false
      description: "Minimum implied risk-free edge percentage (default 0.5)."
      schema:
        type: "number"
        format: "double"
        minimum: 0
        maximum: 99
      example: 0.5
    ArbMinLiquidity:
      name: "min_liquidity"
      in: "query"
      required: false
      description: "Minimum USD liquidity required on the smaller leg (default 0)."
      schema:
        type: "number"
        format: "double"
        minimum: 0
        maximum: 1000000000
      example: 1000
    ArbLimit:
      name: "limit"
      in: "query"
      required: false
      description: "Maximum arbitrage opportunities returned (1 to 100; default 50)."
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 100
      example: 50
    DefiChain:
      name: "chain"
      in: "query"
      required: false
      description: "Blockchain network filter such as Ethereum, Solana, Base, or Arbitrum."
      schema:
        type: "string"
        pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
        maxLength: 40
      example: "Ethereum"
    DefiCategory:
      name: "category"
      in: "query"
      required: false
      description: "Protocol category filter such as Lending, Dexs, Liquid Staking, or Bridge."
      schema:
        type: "string"
        pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
        maxLength: 60
      example: "Lending"
    DefiQuery:
      name: "query"
      in: "query"
      required: false
      description: "Case-insensitive protocol name or slug search."
      schema:
        type: "string"
        pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
        maxLength: 80
      example: "aave"
    DefiMinTvl:
      name: "min_tvl"
      in: "query"
      required: false
      description: "Minimum TVL in USD (default 0)."
      schema:
        type: "number"
        format: "double"
        minimum: 0
        maximum: 1000000000000
      example: 10000000
    StableSymbol:
      name: "symbol"
      in: "query"
      required: false
      description: "Optional stablecoin ticker filter such as USDT or USDC."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9._-]{1,24}$"
        maxLength: 24
      example: "USDT"
    StablePegType:
      name: "peg_type"
      in: "query"
      required: false
      description: "Optional currency peg filter such as peggedUSD or peggedEUR."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9_-]{1,24}$"
        maxLength: 24
      example: "peggedUSD"
    YieldProject:
      name: "project"
      in: "query"
      required: false
      description: "Optional protocol project slug such as aave-v3 or lido."
      schema:
        type: "string"
        pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
        maxLength: 64
      example: "aave"
    YieldSymbol:
      name: "symbol"
      in: "query"
      required: false
      description: "Optional pool token pair substring such as USDC or ETH."
      schema:
        type: "string"
        pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
        maxLength: 40
      example: "USDC"
    YieldStableOnly:
      name: "stablecoin_only"
      in: "query"
      required: false
      description: "Set true to filter to stablecoin-only pools."
      schema:
        type: "string"
        enum:
          - "true"
          - "false"
        maxLength: 5
      example: "true"
    YieldMinTvl:
      name: "min_tvl"
      in: "query"
      required: false
      description: "Minimum pool TVL in USD (default 1000000)."
      schema:
        type: "number"
        format: "double"
        minimum: 0
        maximum: 1000000000000
      example: 1000000
    YieldMinApy:
      name: "min_apy"
      in: "query"
      required: false
      description: "Minimum total pool APY percentage (default 0)."
      schema:
        type: "number"
        format: "double"
        minimum: 0
        maximum: 1000000
      example: 5
    DexQuery:
      name: "query"
      in: "query"
      required: false
      description: "Token ticker, pair, or contract address search (omitted returns top trending on-chain tokens)."
      schema:
        type: "string"
        pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
        maxLength: 80
      example: "SOL"
    DexLimit:
      name: "limit"
      in: "query"
      required: false
      description: "Maximum DEX rows returned (1 to 100; default 30)."
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 100
      example: 30
    BankRequired:
      name: "bank"
      in: "query"
      required: true
      description: "The bank symbol, such as FED; see /macro/interest-rates/banks."
      schema:
        type: "string"
        pattern: "^[A-Za-z_]{2,20}$"
        maxLength: 20
      example: "FED"
    BankOptional:
      name: "bank"
      in: "query"
      required: false
      description: "Only this bank; every bank without it."
      schema:
        type: "string"
        pattern: "^[A-Za-z_]{2,20}$"
        maxLength: 20
      example: "ECB"
    SeriesRequired:
      name: "series"
      in: "query"
      required: true
      description: "The series id; see the dataset's /series list."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9_]{1,40}$"
        maxLength: 40
      example: "cpi_all_sa"
    SeriesOptional:
      name: "series"
      in: "query"
      required: false
      description: "Only this series; every series without it."
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9_]{1,40}$"
        maxLength: 40
      example: "cpi_core_sa"
    StartDate:
      name: "start_date"
      in: "query"
      required: false
      description: "The first date to return."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2025-01-01"
    EndDate:
      name: "end_date"
      in: "query"
      required: false
      description: "The last date to return."
      schema:
        type: "string"
        format: "date"
        maxLength: 10
      example: "2026-11-24"
  responses:
    BadRequest:
      description: "A parameter is missing or malformed."
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "VALIDATION_ERROR"
            message: "Send ticker or cik"
    Unauthorized:
      description: "The API key is missing, unknown or revoked."
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "UNAUTHORIZED"
            message: "The API key is not valid"
    NotFound:
      description: "No company has this ticker or CIK."
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "NOT_FOUND"
            message: "No company has this ticker or CIK"
    RateLimited:
      description: "The key sent more requests in a minute than its limit."
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "RATE_LIMITED"
            message: "Too many requests"
    InternalError:
      description: "Darvas failed; the error is reported."
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "INTERNAL_ERROR"
            message: "Something went wrong"
    Unavailable:
      description: "The data store is unavailable."
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "UNAVAILABLE"
            message: "The data service is unavailable"
  schemas:
    Error:
      type: "object"
      description: "A refusal or failure."
      additionalProperties: false
      required:
        - "error"
      properties:
        error:
          type: "string"
          pattern: "^[A-Z_]{1,64}$"
          description: "A stable code."
          examples:
            - "NOT_FOUND"
        message:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 500
          description: "What went wrong, in English."
          examples:
            - "No company has this ticker or CIK"
      examples:
        - error: "NOT_FOUND"
          message: "No company has this ticker or CIK"
    CompanyTicker:
      type: "object"
      description: "A ticker the company was listed under and the days a source listed it."
      additionalProperties: false
      required:
        - "ticker"
        - "exchange"
        - "first_seen"
        - "last_seen"
      properties:
        ticker:
          type: "string"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The ticker."
          examples:
            - "AAPL"
        exchange:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 32
          description: "The exchange SEC names."
          examples:
            - "Nasdaq"
        first_seen:
          type: "string"
          format: "date"
          description: "First day a source listed the ticker for this company."
          examples:
            - "2026-11-25"
        last_seen:
          type: "string"
          format: "date"
          description: "Last day a source listed it."
          examples:
            - "2026-11-25"
      examples:
        - ticker: "AAPL"
          exchange: "Nasdaq"
          first_seen: "2026-11-25"
          last_seen: "2026-11-25"
    CompanyFacts:
      type: "object"
      description: "A company's SEC profile."
      additionalProperties: false
      required:
        - "ticker"
        - "name"
        - "cik"
        - "is_active"
        - "sec_filings_url"
        - "tickers"
        - "profile_updated_at"
      properties:
        ticker:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The requested ticker, else the one SEC lists now."
          examples:
            - "AAPL"
        name:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "The name SEC holds."
          examples:
            - "Apple Inc."
        cik:
          type: "string"
          pattern: "^[0-9]{10}$"
          description: "Ten digits with leading zeros."
          examples:
            - "0000320193"
        industry:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"

    IncomeStatement:
      type: "object"
      description: "One income statement under standardized field names; a field the filing does not report is null."
      additionalProperties: false
      required:
        - "ticker"
        - "report_period"
        - "fiscal_period"
        - "period"
        - "currency"
        - "accession_number"
        - "form_type"
        - "filing_url"
        - "filing_date"
        - "filing_datetime"
        - "revenue"
        - "cost_of_revenue"
        - "gross_profit"
        - "operating_expense"
        - "selling_general_and_administrative_expenses"
        - "research_and_development"
        - "operating_income"
        - "interest_expense"
        - "ebit"
        - "income_tax_expense"
        - "net_income_discontinued_operations"
        - "net_income_non_controlling_interests"
        - "net_income"
        - "net_income_common_stock"
        - "preferred_dividends_impact"
        - "consolidated_income"
        - "earnings_per_share"
        - "earnings_per_share_diluted"
        - "dividends_per_common_share"
        - "weighted_average_shares"
        - "weighted_average_shares_diluted"
      properties:
        ticker:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The ticker of the income statement's company."
          examples:
            - "AAPL"
        report_period:
          type: "string"
          format: "date"
          description: "The last day of the income statement's period."
          examples:
            - "2025-12-27"
        fiscal_period:
          type: "string"
          pattern: "^[0-9]{4}-(FY|Q[1-4]?)$"
          description: "The income statement's fiscal year and quarter, such as 2026-Q1 or 2025-FY."
          examples:
            - "2026-Q1"
        period:
          type: "string"
          enum:
            - "annual"
            - "quarterly"
            - "ttm"
          description: "Whether the income statement covers a fiscal year, a quarter or the twelve months to its end."
          examples:
            - "quarterly"
        currency:
          type: "string"
          pattern: "^[A-Z]{3}$"
          description: "The ISO 4217 currency of the income statement."
          examples:
            - "USD"
        accession_number:
          type:
            - "string"
            - "null"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "The filing the income statement comes from; for ttm, the filing of its last quarter. Null for a UK or French report, which SEC does not hold."
          examples:
            - "0000320193-26-000006"
        form_type:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 20
          description: "The form the income statement comes from, such as 10-Q or 10-K/A; null for ttm. A fourth quarter carries the 10-K it is derived from. ESEF or UKSEF for a UK or French annual report."
          examples:
            - "10-Q"
        filing_url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "The index page on sec.gov of the income statement's filing; for a UK or French report, its online viewer."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/320193/000032019326000006/0000320193-26-000006-index.htm"
        filing_date:
          type: "string"
          format: "date"
          description: "The day SEC accepted the income statement's filing, in Eastern Time; for a UK or French report, the day it was published."
          examples:
            - "2026-01-30"
        filing_datetime:
          type:
            - "string"
            - "null"
          format: "date-time"
          maxLength: 30
          description: "When SEC accepted the income statement's filing, in Eastern Time with its offset; null for a UK or French report."
          examples:
            - "2026-01-30T06:01:32-05:00"
        revenue:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Total revenue of the period."
          examples:
            - 143756000000
        cost_of_revenue:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Cost of the goods and services sold."
          examples:
            - 74525000000
        gross_profit:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Revenue less cost of revenue."
          examples:
            - 69231000000
        operating_expense:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Operating expenses apart from cost of revenue."
          examples:
            - 18379000000
        selling_general_and_administrative_expenses:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Selling, general and administrative expenses."
          examples:
            - 7492000000
        research_and_development:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Research and development expense."
          examples:
            - 10887000000
        operating_income:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Operating income: gross profit less operating expenses."
          examples:
            - 50852000000
        interest_expense:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Interest expense as the filer reports it."
          examples:
            - null
        ebit:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Earnings before interest and taxes: pretax income plus interest expense, else operating income."
          examples:
            - 51002000000
        income_tax_expense:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Income tax expense, a benefit negative."
          examples:
            - 8905000000
        net_income_discontinued_operations:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Net income of discontinued operations."
          examples:
            - null
        net_income_non_controlling_interests:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Net income attributable to noncontrolling interests."
          examples:
            - null
        net_income:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Net income attributable to the parent's shareholders."
          examples:
            - 42097000000
        net_income_common_stock:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Net income available to common shareholders, after preferred dividends."
          examples:
            - 42097000000
        preferred_dividends_impact:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Preferred dividends and other adjustments."
          examples:
            - null
        consolidated_income:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Net income of the consolidated group, noncontrolling interests included."
          examples:
            - 42097000000
        earnings_per_share:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Basic earnings per share."
          examples:
            - 2.85
        earnings_per_share_diluted:
          type:
            - "number"

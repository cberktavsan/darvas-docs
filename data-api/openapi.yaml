  "/kpi/metrics":
    get:
      operationId: "listKpiMetrics"
      tags:
        - "earnings"
      summary: "List KPI metrics"
      description: "Sector KPIs a company reports in its earnings releases, such as load factor, CET1 ratio, net interest margin, same-store sales or FFO per share, newest release first. Darvas reads them by rules from the press release furnished with each 8-K under Item 2.02, and keeps a release's values when its earnings figures agree with the company's XBRL. limit counts releases across pages; each page holds up to 10 records."
      parameters:
        - $ref: "#/components/parameters/Ticker"
        - $ref: "#/components/parameters/Cik"
        - $ref: "#/components/parameters/MetricName"
        - $ref: "#/components/parameters/KpiPeriod"

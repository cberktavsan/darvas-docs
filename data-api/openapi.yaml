    EarningsRecord:
      type: "object"
      description: "One filing that reports a period."
      additionalProperties: false
      required:
        - "ticker"
        - "report_period"
        - "fiscal_period"
        - "currency"
        - "source_type"
        - "filing_date"
        - "filing_datetime"
        - "filing_window"
        - "filing_url"
        - "accession_number"
      properties:
        ticker:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The ticker of the company."
          examples:
            - "AAPL"
        report_period:
          type: "string"
          format: "date"
          description: "The last day of the period."
          examples:
            - "2026-09-26"
        fiscal_period:
          type: "string"
          pattern: "^[0-9]{4}-(FY|Q[1-4])$"
          description: "The fiscal period, as the company's 10-Q and 10-K name it."
          examples:
            - "2026-Q4"
        currency:
          type: "string"
          pattern: "^[A-Z]{3}$"
          description: "The currency of the amounts."
          examples:
            - "USD"
        source_type:
          type: "string"
          pattern: "^[0-9A-Z-]{2,8}(/A)?$"
          description: "The form: 8-K for a release, 10-Q, 10-K, 20-F or 40-F."
          examples:
            - "8-K"
        filing_date:
          type: "string"
          format: "date"
          description: "The day SEC accepted the filing, in Eastern Time."
          examples:
            - "2026-10-30"
        filing_datetime:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "When SEC accepted the filing, in Eastern Time."
          examples:
            - "2026-10-30T16:30:21-04:00"
        filing_window:
          type:
            - "string"
            - "null"
          enum:
            - "PRE_MARKET"
            - "DURING_MARKET"
            - "AFTER_HOURS"
            - "WEEKEND"
            - null
          description: "The market session at acceptance, in Eastern Time: PRE_MARKET weekdays 04:00 to 09:30, DURING_MARKET 09:30 to 16:00, AFTER_HOURS the rest of a weekday, WEEKEND Saturday and Sunday."
          examples:
            - "AFTER_HOURS"
        signals:
          type: "array"
          maxItems: 8
          description: "Signals the filing's figures raise, most material first; absent when none."
          items:
            $ref: "#/components/schemas/EarningsSignal"
        filing_url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "The index page on SEC EDGAR of the earnings filing."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/0000320193-26-000024-index.htm"
        accession_number:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "The accession number of the earnings filing."
          examples:
            - "0000320193-26-000024"
        quarterly:
          $ref: "#/components/schemas/EarningsPeriod"
        annual:
          $ref: "#/components/schemas/EarningsPeriod"
      examples:
        - ticker: "AAPL"
          report_period: "2026-09-26"
          fiscal_period: "2026-Q4"
          currency: "USD"
          source_type: "8-K"
          filing_date: "2026-10-30"
          filing_datetime: "2026-10-30T16:30:21-04:00"
          filing_window: "AFTER_HOURS"

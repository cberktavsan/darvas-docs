    ScreenerRequest:
      type: "object"
      description: "The filters and order of a screen."
      additionalProperties: false
      required:
        - "filters"
      properties:
        filters:
          type: "array"
          minItems: 1
          maxItems: 20
          description: "Every filter must hold."
          items:
            type: "object"
            description: "One condition on one field."
            additionalProperties: false
            required:
              - "field"
              - "operator"
              - "value"
            properties:
              field:
                type: "string"
                pattern: "^[a-z_]{1,60}$"
                maxLength: 60
                description: "The field, as the filters list names it."
                examples:
                  - "gross_margin"
              operator:
                type: "string"
                enum:
                  - "gt"
                  - "lt"
                  - "gte"
                  - "lte"
                  - "eq"
                  - "in"
                description: "The comparison; in takes a list."
                examples:
                  - "gte"
              value:
                description: "A number for gt, lt, gte, lte and eq; text for eq on sector, industry or ticker; a list for in."
                oneOf:
                  - type: "number"
                    description: "A number to compare with."
                    examples:
                      - 0.6
                  - type: "string"
                    maxLength: 200
                    pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
                    description: "Text to match, in any case."
                    examples:
                      - "Technology"
                  - type: "array"
                    maxItems: 500
                    description: "The values in accepts."
                    items:
                      type:
                        - "number"
                        - "string"
                      maxLength: 200
                      pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
                      description: "One accepted value."
                    examples:
                      - - "AAPL"
                        - "MSFT"
            examples:
              - field: "gross_margin"
                operator: "gte"
                value: 0.6
        currency:
          type: "string"
          pattern: "^[A-Z]{3}$"
          maxLength: 3
          description: "The currency of the statements screened; USD by default."
          examples:
            - "USD"
        order_by:
          type: "object"
          description: "The numeric field results are sorted by; without it, by ticker."
          additionalProperties: false
          required:
            - "field"
          properties:
            field:
              type: "string"
              pattern: "^[a-z_]{1,60}$"
              maxLength: 60
              description: "The field to sort on; it joins every result."
              examples:
                - "revenue"
            direction:
              type: "string"
              enum:
                - "asc"
                - "desc"
              default: "desc"
              description: "Companies without a value come last either way."
              examples:
                - "desc"
          examples:
            - field: "revenue"
              direction: "desc"
        as_of:
          type: "string"
          format: "date"
          maxLength: 10
          description: "Screen what was public on this day, from 2010-01-01."
          examples:
            - "2026-11-01"
        limit:
          type: "integer"
          format: "int32"
          minimum: 1
          maximum: 1000
          default: 10
          description: "Results to return."
          examples:
            - 10
      examples:
        - filters:
            - field: "gross_margin"
              operator: "gte"
              value: 0.6

  "/financials/search/screener":
    post:
      operationId: "screenCompanies"
      tags:
        - "financials"
      summary: "Screen companies"
      description: "Companies whose newest trailing twelve months matches every filter: statement fields, the ratios one period gives alone, the valuations at the latest share price, sector, industry and ticker. A screen leaves out companies whose newest period ends more than 180 days before the screen date. With as_of, each company's newest filing public on that day is screened, valued at the last close at most ten days before it. An answer is shared for a minute."
      requestBody:
        required: true
        description: "The query of screen companies."
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ScreenerRequest"
            example:
              filters:
                - field: "gross_margin"
                  operator: "gte"
                  value: 0.6
                - field: "revenue"
                  operator: "gt"
                  value: 100000000000
              order_by:
                field: "revenue"
                direction: "desc"
              limit: 10
      responses:
        "200":
          description: "Screen companies: one page."
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ScreenerResponse"
              example:
                results:
                  - ticker: "MSFT"
                    report_period: "2026-09-30"
                    currency: "USD"
                    sector: "Technology"
                    industry: "Services-Prepackaged Software"
                    gross_margin: 0.68
                    revenue: 331840000000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":

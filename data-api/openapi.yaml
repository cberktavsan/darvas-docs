    InsiderOwner:
      type: "object"
      description: "A reporting owner of a Form 3, 4 or 5."
      additionalProperties: false
      required:
        - "cik"
        - "name"
        - "is_board_director"
        - "is_officer"
        - "is_ten_percent_owner"
        - "is_other"
      properties:
        cik:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 4294967295
          description: "The owner's CIK."
          examples:
            - 1696841
        name:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "The owner's name, as filed."
          examples:
            - "Teter Timothy S."
        title:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "Officer title, or Director or 10% Owner."
          examples:
            - "EVP, General Counsel"
        is_board_director:
          type: "boolean"
          description: "This owner is a director."
          examples:
            - false
        is_officer:
          type: "boolean"
          description: "This owner is an officer."
          examples:
            - true
        is_ten_percent_owner:
          type: "boolean"
          description: "This owner holds 10% or more."
          examples:
            - false
        is_other:
          type: "boolean"
          description: "The owner has another relationship."
          examples:
            - false
      examples:
        - cik: 1696841
          name: "Teter Timothy S."
          title: "EVP, General Counsel"
          is_board_director: false
          is_officer: true
          is_ten_percent_owner: false
          is_other: false
    InsiderFootnote:
      type: "object"
      description: "A footnote of a Form 3, 4 or 5."
      additionalProperties: false
      required:
        - "id"
        - "text"
      properties:
        id:
          type: "string"
          pattern: "^F[0-9]{1,3}$"
          description: "The footnote id."
          examples:
            - "F1"
        text:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 10000
          description: "The footnote, as filed."
          examples:
            - "Sold under a Rule 10b5-1 trading plan."
      examples:
        - id: "F1"
          text: "Sold under a Rule 10b5-1 trading plan."
    InsiderTrade:
      type: "object"
      description: "One transaction of a Form 4 or 5."
      additionalProperties: false
      required:
        - "issuer"
        - "form_type"
        - "filing_date"
        - "accession_number"
        - "security_title"
        - "issuer_cik"
        - "reporting_owners"
        - "is_derivative"
        - "footnotes"
        - "filing_url"
      properties:
        ticker:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The requested ticker, else the one on the filing of the trade."
          examples:
            - "NVDA"
        issuer:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "The company of the trade, as the filing names it."
          examples:
            - "NVIDIA CORP"
        name:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "The first reporting owner of the trade."
          examples:
            - "Teter Timothy S."
        title:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "Title of the trade's first owner: officer title, or Director or 10% Owner."
          examples:
            - "EVP, General Counsel"
        is_board_director:
          type: "boolean"
          description: "The trade's first owner is a director."
          examples:
            - false
        is_officer:
          type: "boolean"
          description: "The trade's first owner is an officer."
          examples:
            - true
        is_ten_percent_owner:
          type: "boolean"
          description: "The trade's first owner holds 10% or more."
          examples:
            - false
        form_type:
          type: "string"
          pattern: "^[345](/A)?$"
          description: "The form of the trade."
          examples:
            - "4"
        filing_date:
          type: "string"
          format: "date"
          description: "The day SEC received the filing of the trade."
          examples:
            - "2026-09-23"
        accession_number:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "SEC's identifier of the filing of the trade."
          examples:
            - "0001696841-26-000014"
        security_title:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "The security of the trade, as filed."
          examples:
            - "Common Stock"
        issuer_cik:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 4294967295
          description: "The CIK of the issuer of the trade."
          examples:
            - 1045810
        owner_cik:
          type:
            - "integer"
            - "null"
          format: "int64"
          minimum: 1
          maximum: 4294967295
          description: "The CIK of the trade's first owner."
          examples:
            - 1696841
        reporting_owners:
          type: "array"
          maxItems: 50
          description: "Every reporting owner of the trade; joint filings have several."
          items:
            $ref: "#/components/schemas/InsiderOwner"
        is_derivative:
          type: "boolean"
          description: "The trade is in the derivative table: options, units, warrants."
          examples:
            - false
        direct_or_indirect:
          type:
            - "string"
            - "null"
          pattern: "^[DI]$"
          description: "D when the trade is direct, I when indirect."
          examples:
            - "D"
        nature_of_ownership:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "For an indirect trade, the vehicle, such as a trust."
          examples:
            - "By Trust"
        footnotes:
          type: "array"
          maxItems: 50
          description: "The footnotes of the trade with their text."
          items:
            $ref: "#/components/schemas/InsiderFootnote"
        filing_url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "The index page of the trade's filing on sec.gov."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/1045810/000169684126000014/0001696841-26-000014-index.htm"
        report_period:
          type:
            - "string"
            - "null"
          format: "date"
          description: "The period the trade's filing reports on."
          examples:
            - "2026-09-21"
        transaction_date:
          type:
            - "string"
            - "null"
          format: "date"
          description: "The day of the transaction."
          examples:
            - "2026-09-21"
        transaction_code:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z]$"
          description: "SEC's transaction code."
          examples:
            - "S"
        transaction_type:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 60
          description: "What the code means."
          examples:
            - "Sale"
        transaction_shares:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Shares or units in the transaction."
          examples:
            - 2398
        transaction_price_per_share:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Price per share."
          examples:
            - 222.1
        transaction_value:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Shares times price, or the value the filing states."
          examples:
            - 532595.8
        shares_owned_before_transaction:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Shares held before the transaction."
          examples:
            - 27598
        shares_owned_after_transaction:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Shares held after it."
          examples:
            - 25200
        acquired_or_disposed:
          type:
            - "string"
            - "null"
          pattern: "^[AD]$"
          description: "A when acquired, D when disposed of."
          examples:
            - "D"
        is_10b5_1_plan:
          type: "boolean"

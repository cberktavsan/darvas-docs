    FinancialMetrics:
      type: "object"
      description: "One period's ratios of one company."
      additionalProperties: false
      required:
        - "ticker"
        - "report_period"
        - "fiscal_period"
        - "period"
        - "currency"
        - "accession_number"
        - "form_type"
        - "filing_url"
        - "filing_date"
        - "filing_datetime"
        - "market_cap"
        - "enterprise_value"
        - "price_to_earnings_ratio"
        - "price_to_book_ratio"
        - "price_to_sales_ratio"
        - "enterprise_value_to_ebitda_ratio"
        - "enterprise_value_to_revenue_ratio"
        - "free_cash_flow_yield"
        - "peg_ratio"
        - "gross_margin"
        - "operating_margin"
        - "net_margin"
        - "return_on_equity"
        - "return_on_assets"
        - "return_on_invested_capital"
        - "asset_turnover"
        - "inventory_turnover"
        - "receivables_turnover"
        - "days_sales_outstanding"
        - "operating_cycle"
        - "working_capital_turnover"
        - "current_ratio"
        - "quick_ratio"
        - "cash_ratio"
        - "operating_cash_flow_ratio"
        - "debt_to_equity"
        - "debt_to_assets"
        - "interest_coverage"
        - "revenue_growth"
        - "earnings_growth"
        - "book_value_growth"
        - "earnings_per_share_growth"
        - "free_cash_flow_growth"
        - "operating_income_growth"
        - "ebitda_growth"
        - "payout_ratio"
        - "earnings_per_share"
        - "book_value_per_share"
        - "free_cash_flow_per_share"
      properties:
        ticker:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The ticker of the ratios' company."
          examples:
            - "AAPL"
        report_period:
          type: "string"
          format: "date"
          description: "The last day of the ratios' period."
          examples:
            - "2026-09-26"
        fiscal_period:
          type: "string"
          pattern: "^[0-9]{4}-(FY|Q[1-4]?)$"
          description: "The ratios' fiscal year and quarter."
          examples:
            - "2026-FY"
        period:
          type: "string"
          enum:
            - "annual"
            - "quarterly"
            - "ttm"
          description: "Whether the ratios cover a fiscal year, a quarter or a trailing year."
          examples:
            - "annual"
        currency:
          type: "string"
          pattern: "^[A-Z]{3}$"
          description: "The currency of the ratios' statements."
          examples:
            - "USD"
        accession_number:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "The filing of the ratios' statements."
          examples:
            - "0000320193-26-000026"
        form_type:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 20
          description: "The form of the ratios' statements; null for ttm."
          examples:
            - "10-K"
        filing_url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "The index page of the ratios' filing."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/320193/000032019326000026/0000320193-26-000026-index.htm"
        filing_date:
          type: "string"
          format: "date"
          description: "The day SEC accepted the ratios' filing."
          examples:
            - "2026-11-03"
        filing_datetime:
          type:
            - "string"
            - "null"
          format: "date-time"
          maxLength: 30
          description: "When SEC accepted the ratios' filing, in Eastern Time."
          examples:
            - "2026-11-03T16:31:05-05:00"
        market_cap:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The share price times the shares outstanding; without them, the weighted average, diluted first."
          examples:
            - 4956517683567
        enterprise_value:
          type:
            - "number"
            - "null"
          format: "double"
          description: "Market value plus total debt less cash and equivalents."
          examples:
            - 5000323683567
        price_to_earnings_ratio:

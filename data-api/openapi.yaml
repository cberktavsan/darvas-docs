    EarningsSignal:
      type: "object"
      description: "A change against the same period a year before large enough to note."
      additionalProperties: false
      required:
        - "type"
        - "importance"
        - "metric"
        - "period"
        - "headline"
        - "details"
      properties:
        type:
          type: "string"
          enum:
            - "REVENUE_INCREASE"
            - "STRONG_REVENUE_INCREASE"
            - "REVENUE_DECLINE"
            - "STRONG_REVENUE_DECLINE"
            - "NET_INCOME_INCREASE"
            - "STRONG_NET_INCOME_INCREASE"
            - "NET_INCOME_DECLINE"
            - "STRONG_NET_INCOME_DECLINE"
            - "EPS_INCREASE"
            - "STRONG_EPS_INCREASE"
            - "EPS_DECLINE"
            - "STRONG_EPS_DECLINE"
            - "MARGIN_EXPANSION"
            - "MARGIN_CONTRACTION"
          description: "Revenue moved 10% (strong at 20%), net income or EPS 15% (30%), or a margin 100 bps, year over year."
          examples:
            - "REVENUE_INCREASE"
        importance:
          type: "string"
          enum:
            - "HIGH"
            - "MEDIUM"
            - "LOW"
          description: "Strong moves are HIGH; margins move LOW, MEDIUM from 300 bps."
          examples:
            - "MEDIUM"
        metric:
          type: "string"
          pattern: "^[a-z_]{1,40}$"
          description: "The figure the signal is about."
          examples:
            - "revenue"
        period:
          type: "string"
          pattern: "^[0-9]{4}-(FY|Q[1-4])$"
          description: "The fiscal period of the filing."
          examples:

      type: "object"
      description: "The answer of GET /financial-metrics/snapshot/tickers."
      additionalProperties: false
      required:
        - "resource"
        - "listings"
        - "tickers"
      properties:
        resource:
          type: "string"
          enum:
            - "financial-metrics"
          description: "The dataset the list is of."
          examples:
            - "financial-metrics"
        listings:
          type: "array"
          maxItems: 100000
          description: "Every company served."
          items:
            type: "object"
            description: "A company the snapshot serves."
            additionalProperties: false
            required:
              - "ticker"
              - "name"
              - "market"
              - "identifier"
              - "identifier_type"
              - "status"
            properties:
              ticker:
                type: "string"
                pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
                description: "The company's current ticker."
                examples:
                  - "AAPL"
              name:
                type:
                  - "string"
                  - "null"
                pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
                maxLength: 300
                description: "The company's name in its newest SEC profile."
                examples:
                  - "Apple Inc."
              market:
                type: "string"
                enum:
                  - "US"
                description: "The listing's market."
                examples:
                  - "US"
              identifier:
                type: "string"
                pattern: "^[0-9]{10}$"
                description: "The company's CIK, ten digits."
                examples:
                  - "0000320193"
              identifier_type:
                type: "string"
                enum:
                  - "CIK"
                description: "What identifier holds."
                examples:
                  - "CIK"
              status:
                type: "string"
                enum:
                  - "active"
                description: "Every listed company has a recent trailing year."
                examples:
                  - "active"
            examples:
              - ticker: "AAPL"
                name: "Apple Inc."
                market: "US"
                identifier: "0000320193"
                identifier_type: "CIK"
                status: "active"
        tickers:
          type: "array"
          maxItems: 100000
          description: "The same companies' tickers."
          items:

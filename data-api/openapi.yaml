    Filing:
      type: "object"
      description: "One SEC filing of one company."
      additionalProperties: false
      required:
        - "cik"
        - "accession_number"
        - "filing_type"
        - "filing_date"
        - "url"
        - "index_url"
      properties:
        cik:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 4294967295
          description: "The SEC Central Index Key."
          examples:
            - 320193
        accession_number:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "SEC's identifier of the filing."
          examples:
            - "0000320193-26-000105"
        filing_type:
          type: "string"
          pattern: "^[A-Za-z0-9][A-Za-z0-9 /-]{0,19}$"
          description: "The form."
          examples:
            - "10-K"
        report_date:
          type:
            - "string"
            - "null"
          format: "date"
          description: "The period the filing reports on."
          examples:
            - "2026-09-26"
        filing_date:
          type: "string"
          format: "date"
          description: "The day SEC received it."
          examples:
            - "2026-10-31"
        ticker:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The requested ticker, else the company's current one."
          examples:
            - "AAPL"
        url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "The filing's primary document on sec.gov."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/320193/000032019326000105/aapl-20260926.htm"
        accepted_at:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "When EDGAR accepted the filing."
          examples:
            - "2026-10-31T06:01:05Z"
        act:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 8
          description: "The act the filing is made under."
          examples:
            - "34"
        file_number:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 32
          description: "SEC file number."
          examples:
            - "001-36743"
        film_number:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 32
          description: "SEC film number."
          examples:
            - "261234567"
        items:
          type: "array"
          description: "8-K item numbers."
          maxItems: 50
          items:
            type: "string"
            pattern: "^[0-9A-Za-z.]{1,8}$"
            maxLength: 8
          examples:
            - - "2.02"
              - "9.01"
        size_bytes:
          type: "integer"
          format: "int64"
          minimum: 0
          maximum: 100000000000
          description: "Size of the whole submission."
          examples:
            - 9876543
        is_xbrl:
          type: "boolean"
          description: "The filing has XBRL data."
          examples:
            - true
        is_inline_xbrl:
          type: "boolean"
          description: "The XBRL is inline in the HTML."
          examples:
            - true
        primary_document:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "File name of the primary document."
          examples:
            - "aapl-20260926.htm"
        primary_document_description:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "SEC description of the primary document."
          examples:
            - "10-K"
        index_url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "The filing's index page on sec.gov."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/320193/000032019326000105/0000320193-26-000105-index.htm"
      examples:
        - cik: 320193
          accession_number: "0000320193-26-000105"
          filing_type: "10-K"
          report_date: "2026-09-26"
          filing_date: "2026-10-31"
          ticker: "AAPL"
          url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000105/aapl-20260926.htm"
          accepted_at: "2026-10-31T06:01:05Z"
          act: "34"
          file_number: "001-36743"
          film_number: "261234567"
          items: []
          size_bytes: 9876543
          is_xbrl: true
          is_inline_xbrl: true
          primary_document: "aapl-20260926.htm"
          primary_document_description: "10-K"
          index_url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000105/0000320193-26-000105-index.htm"

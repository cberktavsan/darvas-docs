          description: "The ticker of the company of the KPI."
          examples:
            - "AAPL"
        metric_name:
          type: "string"
          pattern: "^[a-z0-9_]{1,80}$"
          description: "The name of the KPI, in snake case."
          examples:
            - "revenue"
        value:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The value of the KPI; the midpoint of a range."
          examples:
            - 10.47
        unit:
          type: "string"
          enum:
            - "%"
            - "dollars"
            - "dollars per share"
            - "dollars per unit"
            - "count"
            - "ratio"
          description: "The unit of the KPI's numbers."
          examples:
            - "%"
        period:
          type: "string"
          pattern: "^(Q[1-4]|FY) [0-9]{4}$"
          description: "The period of the KPI, as Q2 2026 or FY 2026."
          examples:
            - "Q2 2026"
        period_type:
          type: "string"
          enum:
            - "quarterly"
            - "annual"
          description: "Whether the KPI is of a quarter or a year."
          examples:
            - "quarterly"
        source_text:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 2000
          description: "The text the KPI was read from."
          examples:
            - "Adjusted EBITDA: 1054"
        source_url:
          type: "string"
          format: "uri"
          maxLength: 2000
          description: "The exhibit on SEC EDGAR the KPI was read from, with a fragment that highlights the text."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/7789/000000778926000191/ex991.htm#:~:text=Capital%20The%20Company%E2%80%99s%20capital%20position"
        sector:
          type: "string"
          pattern: "^[a-z_]{1,40}$"
          description: "The sector the KPI is listed under."
          examples:
            - "banks"
        yoy_value:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The value a year before, when the release compares."
          examples:
            - 10.1
        yoy_change_pct:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The change against that value, as a decimal."
          examples:
            - 0.036
      examples:
        - ticker: "ASB"
          metric_name: "cet1_ratio"
          value: 10.47
          unit: "%"
          period: "Q2 2026"
          period_type: "quarterly"
          sector: "banks"
          source_text: "Capital The Company’s capital position remains strong, with a CET1 capital ratio of 10.47% at June 30, 2026."

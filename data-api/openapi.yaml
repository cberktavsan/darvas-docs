    FilingEvent:
      type: "object"
      description: "One 8-K or 8-K/A and the events it reports."
      additionalProperties: false
      required:
        - "ticker"
        - "cik"
        - "accession_number"
        - "form_type"
        - "filing_date"
        - "accepted_at"
        - "events"
        - "items"
        - "filing_url"
        - "items_url"
      properties:
        ticker:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The filer's current ticker; null without one."
          examples:
            - "AAPL"
        cik:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 9999999999
          description: "The filer's CIK."
          examples:
            - 320193
        accession_number:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "The 8-K's accession number."
          examples:
            - "0000320193-26-000200"
        form_type:
          type: "string"
          enum:
            - "8-K"
            - "8-K/A"
          description: "8-K, or 8-K/A for an amendment."
          examples:
            - "8-K"
        filing_date:
          type: "string"
          format: "date"
          description: "The day SEC accepted the 8-K, in Eastern Time."
          examples:
            - "2026-11-25"
        accepted_at:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "When SEC accepted the 8-K, in UTC; null when SEC does not say."
          examples:
            - "2026-11-25T21:05:00Z"
        events:
          type: "array"
          description: "The event types of the 8-K's items, in item order."
          items:
            type: "string"
            enum:
              - "material_agreement"
              - "agreement_termination"
              - "bankruptcy"
              - "mine_safety"
              - "cybersecurity_incident"
              - "acquisition_or_disposition"
              - "results_of_operations"
              - "financial_obligation"
              - "obligation_acceleration"
              - "exit_costs"
              - "impairment"
              - "delisting"
              - "unregistered_equity_sale"
              - "holder_rights_change"
              - "auditor_change"
              - "non_reliance"
              - "change_in_control"
              - "executive_change"
              - "charter_amendment"
              - "trading_suspension"
              - "ethics_code_change"
              - "shell_status_change"
              - "shareholder_vote"
              - "shareholder_nominations"
              - "regulation_fd"
              - "other_event"
              - "financial_exhibits"
            description: "An event type the 8-K reports."
          maxItems: 40
          examples:
            - - "executive_change"
              - "financial_exhibits"
        items:
          type: "array"
          description: "The 8-K's item numbers as SEC lists them."
          items:
            type: "string"
            pattern: "^[0-9]{1,2}\\.[0-9]{2}$"
            description: "An item number."
            examples:
              - "5.02"
          maxItems: 40
          examples:
            - - "5.02"
              - "9.01"
        filing_url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "The 8-K's index page on sec.gov."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/320193/000032019326000200/0000320193-26-000200-index.htm"
        items_url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "The request of /filings/items that answers the items' text."
          examples:
            - "https://darvas.app/api/data/v1/filings/items?cik=320193&filing_type=8-K&accession_number=0000320193-26-000200"
      examples:
        - ticker: "AAPL"
          cik: 320193
          accession_number: "0000320193-26-000200"
          form_type: "8-K"
          filing_date: "2026-11-25"
          accepted_at: "2026-11-25T21:05:00Z"
          events:
            - "executive_change"
            - "financial_exhibits"
          items:
            - "5.02"
            - "9.01"
          filing_url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000200/0000320193-26-000200-index.htm"
          items_url: "https://darvas.app/api/data/v1/filings/items?cik=320193&filing_type=8-K&accession_number=0000320193-26-000200"

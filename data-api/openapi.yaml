    News:
      type: "object"
      description: "One piece of news from its primary source."
      additionalProperties: false
      required:
        - "ticker"
        - "title"
        - "source"
        - "date"
        - "url"
        - "published_at"
      properties:
        ticker:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The ticker of a company's news; null for market news."
          examples:
            - "AAPL"
        title:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 500
          description: "The headline."
          examples:
            - "Apple reports fourth quarter results"
        source:
          type: "string"
          pattern: "^[a-z.]{3,40}$"
          description: "The site that published it."
          examples:
            - "sec.gov"
        date:
          type: "string"
          format: "date"
          maxLength: 10
          description: "The day it was published."
          examples:
            - "2026-10-30"
        url:
          type: "string"
          format: "uri"
          maxLength: 1000
          description: "The release or filing."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/a8-kex991.htm"
        published_at:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "When it was published, in UTC, when the source says."
          examples:
            - "2026-10-30T20:30:21Z"
        accession_number:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "A company's news: the filing's accession number."
          examples:
            - "0000320193-26-000024"
      examples:
        - ticker: "AAPL"
          title: "Apple reports fourth quarter results"
          source: "sec.gov"
          date: "2026-10-30"
          url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/a8-kex991.htm"
          published_at: "2026-10-30T20:30:21Z"
          accession_number: "0000320193-26-000024"
    NewsResponse:
      type: "object"
      description: "The answer of GET /news."
      additionalProperties: false
      required:
        - "news"
      properties:
        news:
          type: "array"
          maxItems: 10
          description: "The news, newest first."
          items:
            $ref: "#/components/schemas/News"
      examples:
        - news:
            - ticker: "AAPL"
              title: "Apple reports fourth quarter results"
              source: "sec.gov"
              date: "2026-10-30"
              url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/a8-kex991.htm"
              published_at: "2026-10-30T20:30:21Z"
              accession_number: "0000320193-26-000024"
    SearchRequest:
      type: "object"
      description: "A question and the filings to search."
      additionalProperties: false
      required:
        - "query"
      properties:
        query:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "One question in plain English, 1 to 300 characters."
          examples:
            - "What supply chain risks does Apple face?"
        filters:
          $ref: "#/components/schemas/SearchFilters"
        limit:
          type: "integer"
          format: "int32"
          minimum: 1
          maximum: 10
          default: 5
          description: "The most filings to return."
          examples:
            - 3
      examples:
        - query: "What supply chain risks does Apple face?"
          filters:
            identifiers:
              ticker:
                - "AAPL"
          limit: 3
    SearchFilters:
      type: "object"
      description: "Which filings to search."
      additionalProperties: false
      required: []
      properties:
        identifiers:
          $ref: "#/components/schemas/SearchIdentifiers"
        date:
          $ref: "#/components/schemas/SearchWindow"
        document_types:
          type: "array"
          maxItems: 3
          description: "Only these forms."
          items:
            type: "string"
            enum:
              - "10-K"
              - "10-Q"
              - "8-K"
      examples:
        - identifiers:
            ticker:
              - "AAPL"
    SearchIdentifiers:
      type: "object"
      description: "The companies to search; a ticker no listed company has is a 400."
      additionalProperties: false
      required: []
      properties:
        ticker:
          type: "array"
          maxItems: 20
          description: "Tickers, such as AAPL."
          items:
            type: "string"
            pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,11}$"
            maxLength: 12
        cik:
          type: "array"
          maxItems: 20
          description: "SEC Central Index Keys, leading zeros optional."
          items:
            type: "string"
            pattern: "^[0-9]{1,10}$"
            maxLength: 10
      examples:
        - ticker:
            - "AAPL"
    SearchWindow:
      type: "object"
      description: "The days of the filings to search, both inclusive."
      additionalProperties: false
      required: []
      properties:
        after:
          type: "string"
          format: "date"
          maxLength: 10
          description: "Only filings made public on or after this day."
          examples:
            - "2025-01-01"
        before:
          type: "string"
          format: "date"
          maxLength: 10
          description: "Only filings made public on or before this day."
          examples:
            - "2026-12-31"
      examples:
        - after: "2025-01-01"
    SearchCitation:
      type: "object"
      description: "Where a passage was read, with a link that opens the filing there."
      additionalProperties: false
      required:
        - "document"
        - "date"
        - "section"
        - "link"
      properties:
        document:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "The accession number of the cited filing."
          examples:
            - "0000320193-25-000079"
        date:
          type: "string"
          format: "date"
          maxLength: 10
          description: "The day the filing was made public."
          examples:
            - "2025-10-31"
        section:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "The item or exhibit the passage is in."
          examples:
            - "Item 1A. Risk Factors"
        link:
          type: "string"
          format: "uri"
          maxLength: 2000
          description: "The document, highlighted at the passage."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/320193/000032019325000079/aapl-20250927.htm#:~:text=The%20Company"
      examples:
        - document: "0000320193-25-000079"
          date: "2025-10-31"
          section: "Item 1A. Risk Factors"
          link: "https://www.sec.gov/Archives/edgar/data/320193/000032019325000079/aapl-20250927.htm#:~:text=The%20Company%20depends%20on%20component%20suppliers"
    SearchExcerpt:
      type: "object"
      description: "One passage that answers, with its citation."
      additionalProperties: false
      required:
        - "text"
        - "citation"
        - "attributes"
      properties:
        text:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 1000
          description: "The passage, verbatim, trimmed around its first match."
          examples:
            - "The Company depends on component suppliers."
        citation:
          $ref: "#/components/schemas/SearchCitation"
        attributes:
          $ref: "#/components/schemas/SearchExcerptAttributes"
      examples:
        - text: "The Company depends on component suppliers in its supply chain."
          citation:
            document: "0000320193-25-000079"
            date: "2025-10-31"
            section: "Item 1A. Risk Factors"
            link: "https://www.sec.gov/Archives/edgar/data/320193/000032019325000079/aapl-20250927.htm#:~:text=The%20Company%20depends%20on%20component%20suppliers"
          attributes:
            kind: "text"
    SearchExcerptAttributes:
      type: "object"
      description: "What is true of a passage."
      additionalProperties: false
      required:
        - "kind"
      properties:
        kind:
          type: "string"
          enum:
            - "text"
          description: "Running text."
          examples:
            - "text"
      examples:
        - kind: "text"
    SearchEntity:
      type: "object"
      description: "A company a result is about."
      additionalProperties: false
      required:
        - "name"
        - "identifiers"
      properties:
        name:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "The company's name."
          examples:
            - "Apple Inc."
        identifiers:
          $ref: "#/components/schemas/SearchEntityIdentifiers"
      examples:
        - name: "Apple Inc."
          identifiers:
            cik: "0000320193"
            ticker: "AAPL"
    SearchEntityIdentifiers:
      type: "object"
      description: "A company's identifiers."
      additionalProperties: false
      required:
        - "cik"
      properties:
        cik:
          type: "string"
          pattern: "^[0-9]{10}$"
          description: "The CIK, zero-padded to 10 digits."
          examples:
            - "0000320193"
        ticker:
          type: "string"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The company's ticker, when it has one."
          examples:
            - "AAPL"
      examples:
        - cik: "0000320193"
          ticker: "AAPL"
    SearchResult:
      type: "object"
      description: "One filing and its passages that answer."
      additionalProperties: false
      required:
        - "title"
        - "url"
        - "date"
        - "source"
        - "excerpts"
        - "entities"
        - "attributes"
      properties:
        title:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 400
          description: "The company, the form and the day."
          examples:
            - "Apple Inc. · 10-K 2025-10-31"
        url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "The index page on SEC EDGAR of the result's filing."
          examples:
            - "https://www.sec.gov/x-index.htm"
        date:
          type: "string"
          format: "date"
          maxLength: 10
          description: "The day the result's filing was made public."
          examples:
            - "2025-10-31"
        source:
          type: "string"
          enum:
            - "sec.gov"
          description: "Always sec.gov."
          examples:
            - "sec.gov"
        excerpts:
          type: "array"
          maxItems: 10
          description: "The passages, best first; at most 10."
          items:
            $ref: "#/components/schemas/SearchExcerpt"
        entities:
          type: "array"
          maxItems: 5
          description: "The companies the filing is about."
          items:
            $ref: "#/components/schemas/SearchEntity"
        attributes:
          $ref: "#/components/schemas/SearchResultAttributes"
      examples:
        - title: "Apple Inc. · 10-K 2025-10-31"
          url: "https://www.sec.gov/Archives/edgar/data/320193/000032019325000079/0000320193-25-000079-index.htm"
          date: "2025-10-31"
          source: "sec.gov"
          excerpts:
            - text: "The Company depends on component suppliers in its supply chain."
              citation:
                document: "0000320193-25-000079"
                date: "2025-10-31"
                section: "Item 1A. Risk Factors"
                link: "https://www.sec.gov/Archives/edgar/data/320193/000032019325000079/aapl-20250927.htm#:~:text=The%20Company%20depends%20on%20component%20suppliers"
              attributes:
                kind: "text"
          entities:
            - name: "Apple Inc."
              identifiers:
                cik: "0000320193"
                ticker: "AAPL"
          attributes:
            document_type: "10-K"
    SearchResultAttributes:
      type: "object"
      description: "What is true of a filing."
      additionalProperties: false
      required:
        - "document_type"
      properties:
        document_type:
          type: "string"
          enum:
            - "10-K"
            - "10-Q"
            - "8-K"
          description: "The form of the result's filing."
          examples:
            - "10-K"
      examples:
        - document_type: "10-K"
    SearchWarning:
      type: "object"
      description: "What a partial answer lacks."
      additionalProperties: false
      required:
        - "type"
        - "message"
        - "hint"
      properties:
        type:
          type: "string"
          pattern: "^[a-z_]{1,40}$"
          description: "A code to branch on."
          examples:
            - "filings_being_read"
        message:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "What is missing."
          examples:
            - "Darvas is reading the newest 10-K and 10-Q of 1 of the companies."
        hint:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "What to do."
          examples:
            - "Send the search again in a minute."
      examples:
        - type: "filings_being_read"
          message: "Darvas is reading filings."
          hint: "Send the search again in a minute."
    SearchResponse:
      type: "object"
      description: "The answer of POST /search."
      additionalProperties: false
      required:
        - "search_id"
        - "results"
      properties:
        search_id:
          type: "string"
          format: "uuid"
          maxLength: 36
          description: "The id of this search."
          examples:
            - "3120038d-9620-4b43-9412-a01b4a99d2a3"
        results:
          type: "array"
          maxItems: 10
          description: "One result per filing, best first."
          items:
            $ref: "#/components/schemas/SearchResult"
        warnings:
          type: "array"
          maxItems: 5
          description: "What the answer lacks; absent when nothing."
          items:
            $ref: "#/components/schemas/SearchWarning"
      examples:
        - search_id: "3120038d-9620-4b43-9412-a01b4a99d2a3"
          results:
            - title: "Apple Inc. · 10-K 2025-10-31"
              url: "https://www.sec.gov/Archives/edgar/data/320193/000032019325000079/0000320193-25-000079-index.htm"
              date: "2025-10-31"
              source: "sec.gov"
              excerpts:
                - text: "The Company depends on component suppliers in its supply chain."
                  citation:
                    document: "0000320193-25-000079"
                    date: "2025-10-31"
                    section: "Item 1A. Risk Factors"
                    link: "https://www.sec.gov/Archives/edgar/data/320193/000032019325000079/aapl-20250927.htm#:~:text=The%20Company%20depends%20on%20component%20suppliers"
                  attributes:
                    kind: "text"
              entities:
                - name: "Apple Inc."
                  identifiers:
                    cik: "0000320193"
                    ticker: "AAPL"
              attributes:
                document_type: "10-K"
    TokenTrade:
      type: "object"
      description: "The token's last trade in its pool."
      additionalProperties: false
      required:
        - "price"
        - "size_usd"
        - "side"
        - "transaction"
      properties:
        price:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The dollars paid or got for one token, the pool's fee included."
          examples:
            - 148.7
        size_usd:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The size of the trade in dollars."
          examples:
            - 1250.5
        side:
          type: "string"
          enum:
            - "buy"
            - "sell"
          description: "buy when the trader bought the token."
          examples:
            - "buy"
        transaction:
          type: "string"
          pattern: "^0x[0-9a-f]{64}$"
          description: "The trade's transaction on Base."
          examples:
            - "0x5d3cfd2bc0b8a8a3fbd64e44b1f51c0f4e3a4f8b3d2b47a1b3a0f09dfb6d9e21"
      examples:
        - price: 148.7
          size_usd: 1250.5
          side: "buy"
          transaction: "0x5d3cfd2bc0b8a8a3fbd64e44b1f51c0f4e3a4f8b3d2b47a1b3a0f09dfb6d9e21"
    TokenPool:
      type: "object"
      description: "The USDC pool the price comes from."
      additionalProperties: false
      required:
        - "address"
        - "venue"
        - "usdc"
        - "fee_percent"
      properties:
        address:
          type: "string"
          pattern: "^0x[0-9a-f]{40}$"
          description: "The pool's contract address, in lower case."
          examples:
            - "0xf668e21993f0acd7ab00bb1cfbaed0df28a3c8ec"
        venue:
          type: "string"
          enum:
            - "aerodrome"
            - "uniswap_v3"
          description: "The exchange the pool is on."
          examples:
            - "aerodrome"
        usdc:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The USDC the pool holds."
          examples:
            - 557129.41
        fee_percent:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The pool's fee on a trade, in percent."
          examples:
            - 0.1122
      examples:
        - address: "0xf668e21993f0acd7ab00bb1cfbaed0df28a3c8ec"
          venue: "aerodrome"
          usdc: 557129.41
          fee_percent: 0.1122
    TokenStock:
      type: "object"
      description: "The stock's reference price: the token's published net asset value per share."
      additionalProperties: false
      required:
        - "ticker"
        - "price"
        - "time"
        - "source"
      properties:
        ticker:
          type: "string"
          pattern: "^[A-Z.]{1,6}$"
          description: "The stock's ticker."
          examples:
            - "NVDA"
        price:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The stock's reference price per share."
          examples:
            - 149.12
        time:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "When the feed last updated, in UTC."
          examples:
            - "2026-11-25T21:00:00.000Z"
        source:
          type: "string"
          enum:
            - "nav"
            - "stock_price"
          description: "Where the stock's price comes from: the token's net asset value, or /prices/snapshot."
          examples:
            - "nav"
      examples:
        - ticker: "NVDA"
          price: 149.11517182
          time: "2026-11-25T21:00:00.000Z"
          source: "nav"
    TokenizedStockSnapshot:
      type: "object"
      description: "A token's latest price."
      additionalProperties: false
      required:
        - "ticker"
        - "venue"
        - "market_type"
        - "instrument"
        - "chain"
        - "address"
        - "price"
        - "pool"
        - "shares_per_token"
        - "price_per_share"
        - "observed_at"
      properties:
        ticker:
          type: "string"
          pattern: "^[A-Za-z0-9.-]{1,24}$"
          description: "The instrument's ticker."
          examples:
            - "NVDAc"
        venue:
          type: "string"
          enum:
            - "okx"
            - "bybit"
            - "base"
          description: "Where it trades: the exchange OKX or Bybit, or the Base chain."
          examples:
            - "base"
        market_type:
          type: "string"
          enum:
            - "swap"
            - "spot"
            - "token"
          description: "swap for an OKX perpetual, spot for a Bybit token, token on Base."
          examples:
            - "token"
        instrument:
          type: "string"
          pattern: "^[A-Za-z0-9:.-]{1,60}$"
          description: "The venue's own name for it; a Base token's address."
          examples:
            - "0xb20000000000000000000078ee7ce2fe4908108c"
        chain:
          type:
            - "string"
            - "null"
          enum:
            - "base"
            - null
          description: "The blockchain a Base token is on; null on an exchange."
          examples:
            - "base"
        address:
          type:
            - "string"
            - "null"
          pattern: "^0x[0-9a-f]{40}$"
          description: "A Base token's contract address, in lower case."
          examples:
            - "0xb20000000000000000000078ee7ce2fe4908108c"
        name:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 200
          description: "The stock a Base token stands for."
          examples:
            - "NVIDIA"
        isin:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z]{2}[A-Z0-9]{9}[0-9]$"
          description: "The stock's ISIN."
          examples:
            - "US67066G1040"
        price:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The price of one token in dollars, from its pool; 1 USDC is 1 dollar."
          examples:
            - 148.62
        time:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "The time of the token's last trade, in UTC; null before one is seen."
          examples:
            - "2026-11-26T09:41:13Z"
        time_milliseconds:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The time of the last trade in milliseconds since epoch."
          examples:
            - 1795686073000
        last_trade:
          description: "The last trade; null before one is seen."
          anyOf:
            - $ref: "#/components/schemas/TokenTrade"
            - type: "null"
        pool:
          description: "A Base token's pool; null on an exchange."
          anyOf:
            - $ref: "#/components/schemas/TokenPool"
            - type: "null"
        shares_per_token:
          type:
            - "number"
            - "null"
          format: "double"
          description: "How many shares one token stands for."
          examples:
            - 1.0005
        price_per_share:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The token's price for one share: price over shares_per_token."
          examples:
            - 148.54
        stock:
          description: "The stock's reference price; null without a feed."
          anyOf:
            - $ref: "#/components/schemas/TokenStock"
            - type: "null"
        gap_percent:
          type:
            - "number"
            - "null"
          format: "double"
          description: "price_per_share against the stock's price, in percent; below zero the token is cheaper."
          examples:
            - -0.3856
        observed_at:
          type: "string"
          format: "date-time"
          description: "When the pool was read."
          examples:
            - "2026-11-26T09:42:00.000Z"
      examples:
        - ticker: "NVDAc"
          venue: "base"
          market_type: "token"
          instrument: "0xb20000000000000000000078ee7ce2fe4908108c"
          chain: "base"
          address: "0xb20000000000000000000078ee7ce2fe4908108c"
          name: "NVIDIA"
          isin: "US67066G1040"

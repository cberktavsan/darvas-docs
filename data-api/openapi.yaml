        headline:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 200
          description: "A sentence for display."
          examples:
            - "Revenue up 11.7% year over year"
        details:
          $ref: "#/components/schemas/EarningsSignalDetails"
      examples:
        - type: "REVENUE_INCREASE"
          importance: "MEDIUM"
          metric: "revenue"
          period: "2026-Q4"
          headline: "Revenue up 11.7% year over year"
          details:
            current: 114477000000
            yoy_chg: 0.117229

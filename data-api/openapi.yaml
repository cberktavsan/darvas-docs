    AsReportedFinancials:
      type: "object"
      description: "The three as-reported statements of one period."
      additionalProperties: false
      required:
        - "ticker"
        - "report_period"
        - "fiscal_period"
        - "period"
        - "currency"
        - "accession_number"
        - "filing_url"
        - "income_statement"
        - "balance_sheet"
        - "cash_flow_statement"
      properties:
        ticker:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The ticker of the company of the as-reported statements."
          examples:
            - "AAPL"
        report_period:
          type: "string"
          format: "date"
          description: "The last day of the period of the as-reported statements."
          examples:
            - "2026-09-26"
        fiscal_period:
          type: "string"
          pattern: "^[0-9]{4}-(FY|Q[1-4]?)$"
          description: "The fiscal year and quarter of the as-reported statements."
          examples:
            - "2026-FY"
        period:
          type: "string"
          enum:
            - "annual"
            - "quarterly"
          description: "Whether the as-reported statements comes from an annual or a quarterly report."
          examples:
            - "annual"
        currency:
          type: "string"
          pattern: "^[A-Z]{3}$"
          description: "The currency most values of the as-reported statements are in."
          examples:
            - "USD"
        accession_number:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "The filing of the as-reported statements."
          examples:
            - "0000320193-26-000026"
        filing_url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "The index page of the filing of the as-reported statements."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/320193/000032019326000026/0000320193-26-000026-index.htm"
        income_statement:
          description: "The as-reported income statement; null when the filing has none."
          anyOf:
            - $ref: "#/components/schemas/AsReportedStatementLines"
            - type: "null"
        balance_sheet:
          description: "The as-reported balance sheet; null when the filing has none."
          anyOf:
            - $ref: "#/components/schemas/AsReportedStatementLines"
            - type: "null"
        cash_flow_statement:
          description: "The as-reported cash flow statement; null when the filing has none."
          anyOf:
            - $ref: "#/components/schemas/AsReportedStatementLines"
            - type: "null"
      examples:
        - ticker: "AAPL"
          report_period: "2026-09-26"
          fiscal_period: "2026-FY"
          period: "annual"
          currency: "USD"
          accession_number: "0000320193-26-000026"
          filing_url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000026/0000320193-26-000026-index.htm"
          income_statement: null
          balance_sheet: null
          cash_flow_statement: null

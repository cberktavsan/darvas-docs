            swap_dealers:
              $ref: "#/components/schemas/CotGroup"
            managed_money:
              $ref: "#/components/schemas/CotGroup"
            dealer:
              $ref: "#/components/schemas/CotGroup"
            asset_manager:
              $ref: "#/components/schemas/CotGroup"
            leveraged_funds:
              $ref: "#/components/schemas/CotGroup"
            other_reportables:
              $ref: "#/components/schemas/CotGroup"
            non_reportables:
              $ref: "#/components/schemas/CotGroup"
          examples:
            - leveraged_funds:
                long: 6264
                short: 9875
                spread: 412
                net: -3611
                change_long: 120
                change_short: -85
                change_spread: 10
      examples:
        - report: "tff"
          market_code: "133741"

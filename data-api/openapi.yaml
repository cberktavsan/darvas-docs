          examples:
            - "https://darvas.app/api/data/v1/macro/economic-calendar?cursor=6f1c2a9e-1b2c-4d3e-8f4a-5b6c7d8e9f01"
      examples:
        - economic_calendar:
            - id: "6f1c2a9e-1b2c-4d3e-8f4a-5b6c7d8e9f01"
              series_key: "us-cpi-yoy"

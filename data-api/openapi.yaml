    StatementTicker:
      type: "object"
      description: "A company with annual statements."
      additionalProperties: false
      required:
        - "ticker"
        - "name"
        - "market"
        - "identifier"
        - "identifier_type"
        - "status"
      properties:
        ticker:
          type: "string"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The company's ticker in its market."
          examples:
            - "RR."
        name:
          type:
            - "string"
            - "null"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "The company's name; null when unknown."
          examples:
            - "ROLLS-ROYCE HOLDINGS PLC"
        market:
          type: "string"
          enum:
            - "US"
            - "UK"
            - "FR"
          description: "The company's market."
          examples:
            - "UK"
        identifier:
          type: "string"
          pattern: "^([0-9]{1,10}|[A-Z]{2}[A-Z0-9]{9}[0-9])$"
          description: "The company's CIK in the US, the ISIN of its main share in the UK and France."
          examples:
            - "GB00B63H8491"
        identifier_type:
          type: "string"
          enum:
            - "CIK"
            - "ISIN"
          description: "What identifier is."
          examples:
            - "ISIN"
        status:
          type: "string"
          enum:
            - "active"
            - "inactive"
          description: "active while the newest annual report ended in the last two years."
          examples:
            - "active"
      examples:
        - ticker: "RR."
          name: "ROLLS-ROYCE HOLDINGS PLC"
          market: "UK"
          identifier: "GB00B63H8491"
          identifier_type: "ISIN"
          status: "active"

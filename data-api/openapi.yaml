                          yoy_chg: 0.117229
                    filing_url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/0000320193-26-000024-index.htm"
                    accession_number: "0000320193-26-000024"
                    quarterly:
                      revenue: 114477000000
                      earnings_per_share: 2.11
                      earnings_per_share_diluted: 2.1
                      gross_profit: null
                      operating_income: null
                      net_income: 30711000000

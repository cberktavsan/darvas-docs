                    raw_text: "Revenue is expected to be $108.0 billion, plus or minus 2%."
                    source_text: "Revenue is expected to be $108.0 billion, plus or minus 2%."
                    source_url: "https://www.sec.gov/Archives/edgar/data/7789/000000778926000191/ex991.htm#:~:text=Capital%20The%20Company%E2%80%99s%20capital%20position"
        "400":

    FailToDeliver:
      type: "object"
      description: "The fails of one security on one settlement day."
      additionalProperties: false
      required:
        - "ticker"
        - "cusip"
        - "description"
        - "settlement_date"
        - "quantity"
        - "price"
        - "value"
      properties:
        ticker:
          type: "string"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The security's symbol as SEC lists it."
          examples:
            - "GME"
        cusip:
          type: "string"
          pattern: "^[0-9A-Z]{9}$"
          description: "The security's CUSIP."
          examples:
            - "36467W109"
        description:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 200
          description: "The security as SEC describes it."
          examples:
            - "GAMESTOP CORP CL A"
        settlement_date:
          type: "string"
          format: "date"
          description: "The day the shares failed to settle."
          examples:
            - "2026-10-15"
        quantity:
          type: "integer"
          format: "int64"
          minimum: 0
          maximum: 1000000000000
          description: "Shares that failed to settle that day, all members together."
          examples:
            - 120500
        price:
          type:
            - "number"
            - "null"
          format: "double"
          description: "The security's closing price of the day before; null when SEC gives none."
          examples:
            - 20.5
        value:
          type:
            - "number"
            - "null"
          format: "double"
          description: "quantity times price, in dollars; null without a price."
          examples:
            - 2470250
      examples:
        - ticker: "GME"
          cusip: "36467W109"
          description: "GAMESTOP CORP CL A"
          settlement_date: "2026-10-15"
          quantity: 120500
          price: 20.5
          value: 2470250

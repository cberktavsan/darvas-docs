          type:
            - "number"
            - "null"
          format: "double"
          description: "The week's change of open_interest."
          examples:
            - -300
        groups:
          type: "object"
          description: "The report's trader groups by name: legacy has noncommercial, commercial and non_reportables; disaggregated producer_merchant, swap_dealers, managed_money, other_reportables and non_reportables; tff dealer, asset_manager, leveraged_funds, other_reportables and non_reportables."

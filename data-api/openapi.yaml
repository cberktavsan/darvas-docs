      type: "object"
      description: "A line item at level 1 of the tree, as the filing presents it."
      additionalProperties: false
      required:
        - "label"
        - "full_label"
        - "concept"
        - "value"
        - "children"
      properties:
        label:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 500
          description: "The label the filing shows for a level 1 line."
          examples:
            - "Cash and cash equivalents"
        full_label:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 500
          description: "The standard label of a level 1 line's XBRL concept in the filing."
          examples:

        - number: "Item-2.02"
          name: "Results of Operations and Financial Condition"
          text: "On October 30, 2026, Apple Inc. issued a press release regarding its financial results."
          exhibits:
            - number: "99.1"
              description: "EX-99.1"
              url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/a8-kex991q4202609262026.htm"
              text: "Apple reports fourth quarter results"
    FilingItemsResponse:
      type: "object"
      description: "The answer of GET /filings/items."
      additionalProperties: false
      required:
        - "resource"
        - "ticker"
        - "cik"
        - "filing_type"
        - "accession_number"
        - "year"
        - "quarter"
        - "filing_date"
        - "report_period"
        - "filing_url"
        - "items"
      properties:
        resource:
          type: "string"
          enum:
            - "filing-items"
          description: "Always filing-items."
          examples:
            - "filing-items"
        ticker:
          type:
            - "string"
            - "null"
          pattern: "^[A-Z0-9][A-Z0-9.-]{0,11}$"
          description: "The ticker of the filing's company."
          examples:
            - "AAPL"
        cik:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 4294967295
          description: "The SEC Central Index Key of the filing's company."
          examples:
            - 320193
        filing_type:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 20
          description: "The form as EDGAR lists it, such as 10-K, 10-K405 or 8-K/A."
          examples:
            - "8-K"
        accession_number:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "The filing's accession number."
          examples:
            - "0000320193-26-000024"
        year:
          type: "integer"
          format: "int32"
          minimum: 1993
          maximum: 2100
          description: "The fiscal year of a 10-K or 10-Q; the filing year of an 8-K."
          examples:
            - 2026
        quarter:
          type:
            - "integer"
            - "null"
          format: "int32"
          minimum: 1
          maximum: 4
          description: "The fiscal quarter of a 10-Q; null for other forms."
          examples:
            - null
        filing_date:
          type: "string"
          format: "date"
          description: "The day the filing was filed."
          examples:
            - "2026-10-30"
        report_period:
          type:
            - "string"
            - "null"
          format: "date"
          description: "The last day of the period the filing reports, when EDGAR names one."
          examples:
            - "2026-10-30"
        filing_url:
          type: "string"
          format: "uri"
          maxLength: 500
          description: "The filing's index page on SEC EDGAR."
          examples:
            - "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/0000320193-26-000024-index.htm"
        items:
          type: "array"
          maxItems: 100
          description: "The filing's items in the order it prints them."
          items:
            $ref: "#/components/schemas/FilingItem"
      examples:
        - resource: "filing-items"
          ticker: "AAPL"
          cik: 320193
          filing_type: "8-K"
          accession_number: "0000320193-26-000024"
          year: 2026
          quarter: null
          filing_date: "2026-10-30"
          report_period: "2026-10-30"
          filing_url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/0000320193-26-000024-index.htm"
          items:
            - number: "Item-2.02"
              name: "Results of Operations and Financial Condition"
              text: "On October 30, 2026, Apple Inc. issued a press release regarding its financial results."
              exhibits:
                - number: "99.1"
                  description: "EX-99.1"
                  url: "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/a8-kex991q4202609262026.htm"
                  text: "Apple reports fourth quarter results"
    FilingItemsAccepted:
      type: "object"
      description: "The answer of GET /filings/items while Darvas reads the filing."
      additionalProperties: false
      required:
        - "status"
        - "request_id"
        - "accession_number"
        - "result_url"
        - "estimated_ready_at"
        - "message"
      properties:
        status:
          type: "string"
          enum:
            - "processing"
          description: "Always processing on a 202."
          examples:
            - "processing"
        request_id:
          type: "string"
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: "The identifier of the request Darvas accepted."
          examples:
            - "6f1c3a52-7d5e-4a2b-9c1d-2e3f4a5b6c7d"
        accession_number:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "The filing of the request Darvas accepted."
          examples:
            - "0000320193-26-000024"
        result_url:
          type: "string"
          format: "uri"
          maxLength: 200
          description: "The URL to poll for the result."
          examples:
            - "https://darvas.app/api/data/v1/filings/items/requests/6f1c3a52-7d5e-4a2b-9c1d-2e3f4a5b6c7d"
        estimated_ready_at:
          type: "string"
          format: "date-time"
          description: "When the filing should be read."
          examples:
            - "2026-11-25T18:30:45.000Z"
        message:
          type: "string"
          pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]*$"
          maxLength: 300
          description: "What to do next."
          examples:
            - "Poll result_url after Retry-After seconds."
      examples:
        - status: "processing"
          request_id: "6f1c3a52-7d5e-4a2b-9c1d-2e3f4a5b6c7d"
          accession_number: "0000320193-26-000024"
          estimated_ready_at: "2026-11-25T18:30:45.000Z"
          result_url: "https://darvas.app/api/data/v1/filings/items/requests/6f1c3a52-7d5e-4a2b-9c1d-2e3f4a5b6c7d"
          message: "Darvas is reading this filing from SEC EDGAR. Poll result_url after Retry-After seconds, or send this request again."
    FilingItemsRequestProcessing:
      type: "object"
      description: "A request whose filing Darvas is still reading."
      additionalProperties: false
      required:
        - "status"
        - "request_id"
        - "accession_number"
        - "estimated_ready_at"
      properties:
        status:
          type: "string"
          enum:
            - "processing"
          description: "Poll again after Retry-After seconds."
          examples:
            - "processing"
        request_id:
          type: "string"
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: "The identifier of the request still being read."
          examples:
            - "6f1c3a52-7d5e-4a2b-9c1d-2e3f4a5b6c7d"
        accession_number:
          type: "string"
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
          description: "The filing of the request still being read."
          examples:
            - "0000320193-26-000024"
        estimated_ready_at:
          type: "string"
          format: "date-time"
          description: "When the filing should be read by now."
          examples:
            - "2026-11-25T18:30:45.000Z"
      examples:
        - status: "processing"
          request_id: "6f1c3a52-7d5e-4a2b-9c1d-2e3f4a5b6c7d"
          accession_number: "0000320193-26-000024"
          estimated_ready_at: "2026-11-25T18:30:45.000Z"
    FilingItemsRequestFailed:
